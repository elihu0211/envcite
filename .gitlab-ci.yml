# env-law 單一倉庫、多服務的 CI。
#
# gate 以外的 job 都標 `windows-docker-thin`（thuaisse-lab group runner，不計 GitLab.com 分鐘數）；
# gate 走 shared runner，不佔自建 runner。
#
# 以 `rules:changes` 依路徑分流。proto 是各服務的上游，列入其觸發路徑：契約一改，相關服務都重驗。
include:
  - component: $CI_SERVER_FQDN/components/secret-detection/secret-detection@2.4.0
    inputs:
      stage: check
      enable_mr_pipelines: true
  - component: $CI_SERVER_FQDN/components/sast/sast@3.5.0
    inputs:
      stage: check
      enable_mr_pipelines: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true
  # 只重試 runner 的暫時性失敗；測試失敗不重試。
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  timeout: 30m

stages:
  - check
  - build

variables:
  # 工具與映像版本集中於此，`# renovate:` 註記供 Renovate 更新。
  # renovate: datasource=docker depName=docker
  DOCKER_VERSION: "29.8.1"
  # renovate: datasource=docker depName=bufbuild/buf
  BUF_VERSION: "1.73.0"
  # renovate: datasource=docker depName=tufin/oasdiff
  OASDIFF_VERSION: "v1.32.1"
  # renovate: datasource=docker depName=hadolint/hadolint
  HADOLINT_VERSION: "v2.15.1"
  # renovate: datasource=docker depName=alpine
  ALPINE_VERSION: "3.22"
  # renovate: datasource=docker depName=postgres
  POSTGRES_MAJOR: "18"
  # renovate: datasource=docker depName=mcr.microsoft.com/dotnet/sdk
  DOTNET_VERSION: "10.0"
  # renovate: datasource=pypi depName=uv
  UV_VERSION: "0.12.18"
  # renovate: datasource=python-version depName=python
  PYTHON_VERSION: "3.14"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  COVERAGE_RCFILE: $CI_PROJECT_DIR/pyproject.toml
  UV_LINK_MODE: copy
  # 絕對路徑：job 會 cd 進成員目錄，快取仍須在專案根之下。
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache

.changes-platform: &changes-platform
  - services/platform/**/*
  - proto/**/*
  - .gitlab-ci.yml

# uv workspace 共用根目錄的 pyproject.toml 與 uv.lock，兩者一改，全部重驗。
.changes-ontology: &changes-ontology
  - services/ontology/**/*
  - libs/python/**/*
  - proto/**/*
  - pyproject.toml
  - uv.lock
  - .gitlab-ci.yml

.changes-consult: &changes-consult
  - services/consult/**/*
  - libs/python/**/*
  - proto/**/*
  - pyproject.toml
  - uv.lock
  - .gitlab-ci.yml

.changes-segmenter: &changes-segmenter
  - libs/python/env-law-segmenter/**/*
  - pyproject.toml
  - uv.lock
  - .gitlab-ci.yml

.changes-python-proto: &changes-python-proto
  - libs/python/env-law-proto/**/*
  - proto/**/*
  - pyproject.toml
  - uv.lock
  - .gitlab-ci.yml

.changes-dockerfile: &changes-dockerfile
  - services/*/Dockerfile
  - .gitlab-ci.yml

.changes-proto: &changes-proto
  - proto/**/*
  - buf.yaml
  - .gitlab-ci.yml

# 自建 runner 的 tag 只在這裡定義。
.runner:
  tags: [windows-docker-thin]

# Docker-in-Docker：dotnet 的 Testcontainers 與映像建置共用。
.dind:
  services:
    - name: docker:${DOCKER_VERSION}-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

# 只改文件的 MR 不符合任何 `rules:changes`，不會有 pipeline，而合併要求 pipeline 成功。
# 此 job 讓 pipeline 永遠存在。
gate:
  stage: check
  image: alpine:$ALPINE_VERSION
  variables:
    GIT_STRATEGY: none
  script:
    - echo "path-specific jobs below decide what else runs"

dotnet:
  extends: [.runner, .dind]
  stage: check
  rules:
    - changes: *changes-platform
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  variables:
    TESTCONTAINERS_HOST_OVERRIDE: docker
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages
  cache:
    # prefix：runner 的 S3 cache 為 Shared，避免同 key 跨專案共用。
    - key:
        prefix: "$CI_PROJECT_PATH"
        files: [services/platform/Directory.Packages.props]
      paths: [.nuget/packages]
  script:
    - cd services/platform
    - dotnet restore
    - dotnet build --no-restore
    # openapi/ 由建置產生並提交；與程式碼不一致即失敗，重新建置後提交。
    - test -z "$(git status --porcelain -- openapi/)"
    - dotnet format --verify-no-changes --no-restore
    - >-
      dotnet test --no-build
      --collect:"XPlat Code Coverage" --results-directory "$CI_PROJECT_DIR/artifacts"
      --logger "junit;LogFilePath=$CI_PROJECT_DIR/artifacts/{assembly}-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - artifacts/*test-result.xml
    reports:
      junit: artifacts/*test-result.xml
      coverage_report:
        coverage_format: cobertura
        path: artifacts/**/coverage.cobertura.xml

# Python 成員共用：同步整個 workspace（`--locked` 驗證鎖檔），再於 `$MEMBER` 執行檢查。
.python:
  extends: .runner
  stage: check
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-trixie-slim
  cache:
    # prefix：runner 的 S3 cache 為 Shared，避免同 key 跨專案共用。
    - key:
        prefix: "$CI_PROJECT_PATH"
        files: [uv.lock]
      paths: [.uv-cache]
  before_script:
    - uv sync --locked --all-packages
    - cd "$MEMBER"
  after_script:
    - uv cache prune --ci

.python-checks:
  extends: .python
  script:
    - uv run --no-sync ruff check .
    - uv run --no-sync ruff format --check .
    - uv run --no-sync mypy src tests
    - uv run --no-sync pytest --cov --cov-report=term --cov-report=xml:$CI_PROJECT_DIR/coverage.xml --junitxml="$CI_PROJECT_DIR/report.xml"
  coverage: '/^TOTAL\s.*\s(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

ontology:
  extends: .python-checks
  rules:
    - changes: *changes-ontology
  # 測試需要真實 PostgreSQL：以 job service 附掛，省掉 dind 與一次映像拉取。
  # 主版本與正式區相同。
  services:
    - name: postgres:$POSTGRES_MAJOR
      alias: postgres
  variables:
    MEMBER: services/ontology
    POSTGRES_DB: env_law_test
    POSTGRES_USER: env_law
    POSTGRES_PASSWORD: env_law
    ONTOLOGY_TEST_DSN: "postgresql://env_law:env_law@postgres:5432/env_law_test"

consult:
  extends: .python-checks
  rules:
    - changes: *changes-consult
  variables:
    MEMBER: services/consult

# 重新產生後須與提交的產生碼一致。
python-proto:
  extends: .python
  rules:
    - changes: *changes-python-proto
  variables:
    MEMBER: libs/python/env-law-proto
  script:
    - cp -r src "$CI_PROJECT_DIR/.generated-before"
    - ./scripts/generate.sh
    - diff -r -x __pycache__ "$CI_PROJECT_DIR/.generated-before" src
    - uv run --no-sync mypy src

# 映像建置：MR 只驗證建置，預設分支才推送。tag 只用 commit SHA（不推 latest），
# env-law-deploy 的 Image Updater 依此上線。
.image:
  extends: [.runner, .dind]
  stage: build
  image: docker:$DOCKER_VERSION
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA
    # 層快取放 registry（dind 每次全新）。路徑與映像分開，快取 tag 不會被 Image Updater 當成新版本。
    CACHE: $CI_REGISTRY_IMAGE/cache/$SERVICE
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # 匯出 registry 快取需要 docker-container driver。
    # 用 host 網路：job 容器 MTU 為 1360，dind 橋接網路預設 1500，大封包被靜默丟棄，
    # 症狀是 `dotnet restore` 連 api.nuget.org 逾時。
    - docker buildx create --use --driver docker-container --driver-opt network=host --buildkitd-flags '--oci-worker-net=host'
  script:
    # 快取先讀本分支、再讀預設分支，各分支各寫各的；讀寫失敗不該讓建置失敗。
    # platform 的 Dockerfile 不用 uv／Python 版本，多餘的 build-arg 只會警告。
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        output="--push"
      else
        echo "非預設分支，只驗證建置、不推送：$IMAGE"
        output="--output type=cacheonly"
      fi
      docker buildx build -f services/$SERVICE/Dockerfile \
        --build-arg UV_VERSION="$UV_VERSION" \
        --build-arg PYTHON_VERSION="$PYTHON_VERSION" \
        --cache-from "type=registry,ref=$CACHE:$CI_COMMIT_REF_SLUG" \
        --cache-from "type=registry,ref=$CACHE:$CI_DEFAULT_BRANCH" \
        --cache-to "type=registry,ref=$CACHE:$CI_COMMIT_REF_SLUG,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true" \
        -t "$IMAGE" $output .

ontology-image:
  extends: .image
  needs: [ontology]
  rules:
    - changes: *changes-ontology
  variables:
    SERVICE: ontology

consult-image:
  extends: .image
  needs: [consult]
  rules:
    - changes: *changes-consult
  variables:
    SERVICE: consult

platform-image:
  extends: .image
  needs: [dotnet, openapi]
  rules:
    - changes: *changes-platform
  variables:
    SERVICE: platform

segmenter:
  extends: .python-checks
  rules:
    - changes: *changes-segmenter
  # 不需資料庫。CI 只驗契約（同一份詞典得到同一個 tokenizer id 與同一批 token）；
  # 斷詞品質由 scripts/measure-segmentation.py 量測，需要網路，不在 CI 跑。
  variables:
    MEMBER: libs/python/env-law-segmenter

# 對外 REST 的相容性檢查（同 proto 的 buf breaking），以目標分支已提交的規格為基準；規格與程式碼是否一致由 dotnet job 檢查。
openapi:
  extends: .runner
  stage: check
  rules:
    - changes: *changes-platform
  image:
    name: tufin/oasdiff:$OASDIFF_VERSION
    entrypoint: [""]
  variables:
    SPEC: services/platform/openapi/openapi_v2.json
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        echo "非 MR pipeline，不執行相容性檢查"
      elif git fetch -q --depth=1 origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" && git show "FETCH_HEAD:$SPEC" > /tmp/base.json 2>/dev/null; then
        oasdiff breaking /tmp/base.json "$SPEC" --fail-on ERR
      else
        echo "目標分支 ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME} 尚無 $SPEC，無基準可比——跳過相容性檢查"
      fi

proto:
  extends: .runner
  stage: check
  rules:
    - changes: *changes-proto
  image:
    name: bufbuild/buf:$BUF_VERSION
    entrypoint: [""]
  script:
    - buf lint
    # 目標分支尚無 proto 模組時沒有基準可比，明示跳過，不靜默通過。
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        echo "非 MR pipeline，不執行相容性檢查"
      elif buf build "${CI_REPOSITORY_URL}#branch=${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" -o /dev/null >/dev/null 2>&1; then
        buf breaking --against "${CI_REPOSITORY_URL}#branch=${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
      else
        echo "目標分支 ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME} 尚無 proto 模組，無基準可比——跳過相容性檢查"
      fi

dockerfile:
  extends: .runner
  stage: check
  rules:
    - changes: *changes-dockerfile
  image:
    name: hadolint/hadolint:$HADOLINT_VERSION-alpine
    entrypoint: [""]
  script:
    - hadolint services/*/Dockerfile
