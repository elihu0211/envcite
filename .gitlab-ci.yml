# env-law 單一倉庫、多服務的 CI。
#
# gate 以外的 job 都標 `windows-docker-thin`（thuaisse-lab group runner，不計 GitLab.com 分鐘數）；
# gate 走 shared runner，不佔自建 runner。
#
# 以 `rules:changes` 依路徑分流。proto 是各服務的上游，列入其觸發路徑：契約一改，相關服務都重驗。
include:
  - component: $CI_SERVER_FQDN/components/secret-detection/secret-detection@2.4.0
    inputs:
      stage: check
      enable_mr_pipelines: true
  - component: $CI_SERVER_FQDN/components/sast/sast@3.5.0
    inputs:
      stage: check
      enable_mr_pipelines: true

workflow:
  # 只跑 MR pipeline 與預設分支 pipeline；沒有開 MR 的功能分支不跑 CI。
  # 不保留 branch pipeline：先 push 再開 MR 時，同一個 SHA 會同時跑 push 與 merge_request_event
  # 兩條 pipeline，搶唯一的 `windows-docker-thin` runner，排隊白白拉長。
  # 要驗證就開 MR（`git push -o merge_request.create`）。
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # 預設分支不自動取消：它的 pipeline 會推映像，中途取消會少掉該 commit 的 SHA tag。
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      auto_cancel:
        on_new_commit: none
  # 同一 MR 的新 commit 會取消尚在跑的舊 pipeline（job 須為 interruptible，見 default）。
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true
  # 只重試 runner 的暫時性失敗；測試失敗不重試。
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  timeout: 30m

stages:
  - prepare
  - check
  - build

variables:
  # 工具與映像版本集中於此，`# renovate:` 註記供 Renovate 更新。
  # renovate: datasource=docker depName=docker
  DOCKER_VERSION: "29.8.1"
  # renovate: datasource=docker depName=bufbuild/buf
  BUF_VERSION: "1.73.0"
  # renovate: datasource=docker depName=tufin/oasdiff
  OASDIFF_VERSION: "v1.32.1"
  # renovate: datasource=docker depName=hadolint/hadolint
  HADOLINT_VERSION: "v2.15.1"
  # renovate: datasource=docker depName=alpine
  ALPINE_VERSION: "3.22"
  # renovate: datasource=docker depName=postgres
  POSTGRES_MAJOR: "18"
  # 完整版本，不用浮動的 "10.0"：套件快取（含 bundle 需要的 runtime pack、ILLink tasks）隨 SDK 版本，
  # 快取鍵帶這個值；Dockerfile 的 ARG 與此同步（Renovate 兩處都追蹤，同一個 MR 升）。
  # renovate: datasource=docker depName=mcr.microsoft.com/dotnet/sdk
  DOTNET_VERSION: "10.0.401"
  # renovate: datasource=pypi depName=uv
  UV_VERSION: "0.12.18"
  # renovate: datasource=python-version depName=python
  PYTHON_VERSION: "3.14"
  # renovate.json 的驗證用。更新本身由 thuaisse-lab/chepb-1150011621 的每週排程集中執行（用它自己的
  # Renovate 版本），兩邊版本各自升級；驗證通過但執行端版本較舊時，以執行端的 log 為準。
  # renovate: datasource=docker depName=renovate/renovate
  RENOVATE_VERSION: "43.272.4"
  # NuGet Audit 在每次 restore 向 api.nuget.org 查弱點資料：Nexus 的來源索引把這個資源指回上游，
  # 不經快取，是還原步驟裡唯一一個繞過鏡像的獨立下載，逾時就讓整個 restore 失敗（NU1900，
  # 在 TreatWarningsAsErrors 下是錯誤）。CI 一律關閉；弱點由 Renovate 的 osvVulnerabilityAlerts 監控。
  NuGetAudit: "false"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  COVERAGE_RCFILE: $CI_PROJECT_DIR/pyproject.toml
  UV_LINK_MODE: copy
  # 絕對路徑：job 會 cd 進成員目錄，快取仍須在專案根之下。
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache

# 依賴只在 prepare 階段由 deps-* 下載一次並寫入快取；其餘 job 一律 `policy: pull`，且在
# 離線模式下執行（見各 job），任何獨立下載都會立刻失敗，而不是各自連外網、卡在網路上。
# NuGet 的 key 綁套件清單的雜湊：清單沒變，所有分支與 main 共用同一份，不必各自冷啟動。冷啟動
# 是下載 153 個套件、約 170 MB（2026-10-13 讀 project.assets.json 加總），所需時間由頻寬決定：
# 實測從約 500 KB/s（4 分鐘）掉到約 190 KB/s（超過 15 分鐘）。key 帶專案路徑：這台 runner 的
# S3 cache 開了 Shared，同 key 會跨專案共用。
.cache-nuget: &cache-nuget
  key:
    prefix: "$CI_PROJECT_PATH-sdk$DOTNET_VERSION"
    files: [services/platform/Directory.Packages.props]
  paths: [.nuget/packages]

# uv 的 key 綁 uv.lock 的雜湊，理由同 NuGet：鎖檔沒變，所有分支與 main 共用同一份。
.cache-uv: &cache-uv
  key:
    prefix: "$CI_PROJECT_PATH"
    files: [uv.lock]
  paths: [.uv-cache]

# `rules:changes` 沒有排除語法，所以列「會影響建置與測試的路徑」，不列整個服務目錄：只改 Markdown
# （README、AGENTS.md）或 `.env.example` 的 MR 不啟動測試與映像建置。服務新增頂層的程式或設定檔時，
# 要補進對應的清單，否則該檔的改動不會觸發 CI。
.changes-platform: &changes-platform
  - services/platform/src/**/*
  - services/platform/tests/**/*
  - services/platform/openapi/**/*
  - services/platform/.editorconfig
  - services/platform/Directory.*
  - services/platform/Dockerfile*
  - services/platform/EnvLaw.Platform.slnx
  - services/platform/dotnet-tools.json
  - services/platform/global.json
  - proto/**/*
  - .gitlab-ci.yml

# uv workspace 共用根目錄的 pyproject.toml 與 uv.lock，兩者一改，全部重驗。
.changes-ontology: &changes-ontology
  - services/ontology/src/**/*
  - services/ontology/tests/**/*
  - services/ontology/migrations/**/*
  - services/ontology/tools/**/*
  - services/ontology/Dockerfile*
  - services/ontology/models.example.toml
  - services/ontology/pyproject.toml
  - libs/python/*/src/**/*
  - libs/python/*/tests/**/*
  - libs/python/*/scripts/**/*
  - libs/python/*/pyproject.toml
  - proto/**/*
  - pyproject.toml
  - uv.lock
  - .gitlab-ci.yml

.changes-consult: &changes-consult
  - services/consult/src/**/*
  - services/consult/tests/**/*
  - services/consult/Dockerfile*
  - services/consult/pyproject.toml
  - libs/python/*/src/**/*
  - libs/python/*/tests/**/*
  - libs/python/*/scripts/**/*
  - libs/python/*/pyproject.toml
  - proto/**/*
  - pyproject.toml
  - uv.lock
  - .gitlab-ci.yml

.changes-segmenter: &changes-segmenter
  - libs/python/env-law-segmenter/src/**/*
  - libs/python/env-law-segmenter/tests/**/*
  - libs/python/env-law-segmenter/scripts/**/*
  - libs/python/env-law-segmenter/pyproject.toml
  - pyproject.toml
  - uv.lock
  - .gitlab-ci.yml

.changes-python-proto: &changes-python-proto
  - libs/python/env-law-proto/src/**/*
  - libs/python/env-law-proto/scripts/**/*
  - libs/python/env-law-proto/pyproject.toml
  - proto/**/*
  - pyproject.toml
  - uv.lock
  - .gitlab-ci.yml

# 所有 Python job 的觸發路徑聯集：deps-python 在其中任何一個 job 要跑時就要跑。
.changes-python: &changes-python
  - services/ontology/src/**/*
  - services/ontology/tests/**/*
  - services/ontology/migrations/**/*
  - services/ontology/tools/**/*
  - services/ontology/Dockerfile*
  - services/ontology/models.example.toml
  - services/ontology/pyproject.toml
  - services/consult/src/**/*
  - services/consult/tests/**/*
  - services/consult/Dockerfile*
  - services/consult/pyproject.toml
  - libs/python/*/src/**/*
  - libs/python/*/tests/**/*
  - libs/python/*/scripts/**/*
  - libs/python/*/pyproject.toml
  - proto/**/*
  - pyproject.toml
  - uv.lock
  - .gitlab-ci.yml

.changes-dockerfile: &changes-dockerfile
  - services/*/Dockerfile
  - .gitlab-ci.yml

.changes-proto: &changes-proto
  - proto/**/*
  - buf.yaml
  - .gitlab-ci.yml

# 自建 runner 的 tag 只在這裡定義。
.runner:
  tags: [windows-docker-thin]

# Docker-in-Docker：dotnet 的 Testcontainers 與映像建置共用。
.dind:
  services:
    - name: docker:${DOCKER_VERSION}-dind
      alias: docker
      # buildkit 映像從 runner 主機的 registry 快取（http）拉取，dockerd 要放行私網位址。
      command:
        - --insecure-registry=10.0.0.0/8
        - --insecure-registry=172.16.0.0/12
        - --insecure-registry=192.168.0.0/16
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

# 只改文件的 MR 不符合任何 `rules:changes`，不會有 pipeline，而合併要求 pipeline 成功。
# 此 job 讓 pipeline 永遠存在。
gate:
  stage: check
  image: alpine:$ALPINE_VERSION
  variables:
    GIT_STRATEGY: none
  script:
    - echo "path-specific jobs below decide what else runs"

# renovate.json 改壞時 Renovate 只會開一個 issue，更新靜默停擺、沒有任何紅燈：在 MR 先擋下。
# 映像首次拉取（約 0.4 GB）也算在 timeout 內，給寬一點。
renovate-config:
  extends: .runner
  stage: check
  image:
    name: renovate/renovate:$RENOVATE_VERSION
    # image 的 ENTRYPOINT 是 renovate 本身，清空才能跑 script。
    entrypoint: [""]
  needs: []
  timeout: 10m
  rules:
    - changes:
        - renovate.json
  script:
    - renovate-config-validator --strict renovate.json

deps-dotnet:
  stage: prepare
  tags: [windows-docker-thin]
  # 套件由 Nexus 提供：命中時是區網速度。Nexus 每下載完一個套件就存一個，所以連它自己的
  # 冷啟動逾時，重跑也是接著已快取的部分，不需要在這裡另做續傳。
  timeout: 20m
  rules:
    - changes: *changes-platform
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  variables:
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages
  cache:
    - <<: *cache-nuget
  script:
    # 套件走 runner 主機的 Nexus 快取（ci/nuget.mirror.config）。鏡像不可用時直接說明，
    # 不退回直連上游：失敗的請求也計入 Nexus 的每日額度。
    - timeout 10 bash -c '</dev/tcp/host.docker.internal/8081' || { echo "Nexus 鏡像（host.docker.internal:8081）不可用；請檢查 runner 主機上的 Nexus。" >&2; exit 1; }
    - mkdir -p ~/.nuget/NuGet && cp ci/nuget.mirror.config ~/.nuget/NuGet/NuGet.Config
    # 鎖檔（packages.lock.json）釘住完整依賴圖含間接依賴；與清單不一致即失敗，快取內容因此只由清單決定。
    - (cd services/platform && dotnet restore --locked-mode)
    # 映像建置要的另一份：它離線執行，只讀這個快取。內容與 Dockerfile 的指令同源，見腳本。
    - ci/prime-dotnet-image-cache.sh

dotnet:
  extends: [.runner, .dind]
  stage: check
  rules:
    - changes: *changes-platform
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  variables:
    TESTCONTAINERS_HOST_OVERRIDE: docker
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages
  needs: [deps-dotnet]
  cache:
    - <<: *cache-nuget
      policy: pull
  script:
    - cd services/platform
    # 套件已由 deps-dotnet 備妥；來源指向空目錄，缺任何套件即失敗，不會連外網。
    - mkdir -p "$CI_PROJECT_DIR/.nuget/no-source"
    - dotnet restore --locked-mode --source "$CI_PROJECT_DIR/.nuget/no-source"
    - dotnet build --no-restore
    # openapi/ 由建置產生並提交；與程式碼不一致即失敗，重新建置後提交。
    - test -z "$(git status --porcelain -- openapi/)"
    - dotnet format --verify-no-changes --no-restore
    - >-
      dotnet test --no-build
      --collect:"XPlat Code Coverage" --results-directory "$CI_PROJECT_DIR/artifacts"
      --logger "junit;LogFilePath=$CI_PROJECT_DIR/artifacts/{assembly}-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - artifacts/*test-result.xml
    reports:
      junit: artifacts/*test-result.xml
      coverage_report:
        coverage_format: cobertura
        path: artifacts/**/coverage.cobertura.xml

# Python 依賴：整個 workspace 只有一份 uv.lock，下載一次供所有 Python job 使用。
deps-python:
  stage: prepare
  tags: [windows-docker-thin]
  rules:
    - changes: *changes-python
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-trixie-slim
  cache:
    - <<: *cache-uv
  script:
    - uv sync --locked --all-packages
  after_script:
    # 不用 `--ci`：它會刪掉下載的 wheel，而消費端是離線的，需要這些 wheel。
    - uv cache prune

# Python 成員共用。workspace 只有一份 uv.lock：每個 job 同步整個 workspace（`--locked`
# 同時驗證鎖檔與所有成員一致），再於 `$MEMBER` 目錄執行該成員的檢查。
.python:
  extends: .runner
  stage: check
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-trixie-slim
  needs: [deps-python]
  variables:
    UV_OFFLINE: "1"
  cache:
    - <<: *cache-uv
      policy: pull
  before_script:
    - uv sync --locked --all-packages
    - cd "$MEMBER"

.python-checks:
  extends: .python
  script:
    - uv run --no-sync ruff check .
    - uv run --no-sync ruff format --check .
    - uv run --no-sync mypy src tests
    - uv run --no-sync pytest --cov --cov-report=term --cov-report=xml:$CI_PROJECT_DIR/coverage.xml --junitxml="$CI_PROJECT_DIR/report.xml"
  coverage: '/^TOTAL\s.*\s(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

ontology:
  extends: .python-checks
  rules:
    - changes: *changes-ontology
  # 測試需要真實 PostgreSQL：以 job service 附掛，省掉 dind 與一次映像拉取。
  # 主版本與正式區相同。
  services:
    - name: postgres:$POSTGRES_MAJOR
      alias: postgres
  variables:
    MEMBER: services/ontology
    POSTGRES_DB: env_law_test
    POSTGRES_USER: env_law
    POSTGRES_PASSWORD: env_law
    ONTOLOGY_TEST_DSN: "postgresql://env_law:env_law@postgres:5432/env_law_test"

consult:
  extends: .python-checks
  rules:
    - changes: *changes-consult
  variables:
    MEMBER: services/consult

# 重新產生後須與提交的產生碼一致。
python-proto:
  extends: .python
  rules:
    - changes: *changes-python-proto
  variables:
    MEMBER: libs/python/env-law-proto
  script:
    - cp -r src "$CI_PROJECT_DIR/.generated-before"
    - ./scripts/generate.sh
    - diff -r -x __pycache__ "$CI_PROJECT_DIR/.generated-before" src
    - uv run --no-sync mypy src

# 映像建置：MR 只驗證建置，預設分支才推送。tag 只用 commit SHA（不推 latest），
# env-law-deploy 的 Image Updater 依此上線。
.image:
  extends: [.runner, .dind]
  stage: build
  image: docker:$DOCKER_VERSION
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA
    # 層快取放 registry（dind 每次全新）。路徑與映像分開，快取 tag 不會被 Image Updater 當成新版本。
    CACHE: $CI_REGISTRY_IMAGE/cache/$SERVICE
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # 匯出 registry 快取需要 docker-container driver。
    # 用 host 網路：job 容器 MTU 為 1360，dind 橋接網路預設 1500，大封包被靜默丟棄，
    # 症狀是 `dotnet restore` 連 api.nuget.org 逾時。
    # 基底映像與 buildkit 映像都不直連上游，也沒有退回上游的路：Dockerfile 的 FROM 以 build-arg
    # 直接指向 runner 主機上既有的 pull-through 快取（5000 docker.io、5002 ghcr.io、5004
    # mcr.microsoft.com），快取沒有就建置失敗。BuildKit 的 registry mirror 設定不用，因為它找不到
    # 時會退回原 registry。位址取 job 容器解析到的 host-gateway（buildkit 在 dind 的 host 網路裡
    # 看不到 job 容器的 /etc/hosts，不能用名稱）；buildkitd.toml 只用來放行這幾個 http 位址。
    # before_script 與 script 在同一個 shell，host_ip 留給下面的建置用。
    - |
      host_ip=$(awk '/host\.docker\.internal/ {print $1; exit}' /etc/hosts)
      [ -n "$host_ip" ] || { echo "解析不到 host.docker.internal，無法使用 runner 主機的 registry 快取" >&2; exit 1; }
      for port in 5000 5002 5004; do
        printf '[registry."%s:%s"]\n  http = true\n  insecure = true\n' "$host_ip" "$port"
      done > buildkitd.toml
      docker buildx create --use --driver docker-container \
        --driver-opt "network=host,image=$host_ip:5000/moby/buildkit:buildx-stable-1" \
        --buildkitd-flags '--oci-worker-net=host' --buildkitd-config buildkitd.toml
  script:
    # 套件不在這裡下載：Dockerfile 的套件步驟以 `--network=none` 執行，只讀 prepare 階段備好的
    # 快取（deps-*），經 $CONTEXTS 以 build context 傳入。缺套件就建置失敗，不會連外網。
    # 層快取先讀本分支、再讀預設分支，各分支各寫各的；讀寫失敗不該讓建置失敗。
    # 各 Dockerfile 只用其中一部分 build-arg，多餘的只會警告。
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        output="--push"
      else
        echo "非預設分支，只驗證建置、不推送：$IMAGE"
        output="--output type=cacheonly"
      fi
      docker buildx build -f services/$SERVICE/Dockerfile $CONTEXTS \
        --build-arg DOCKER_HUB="$host_ip:5000" \
        --build-arg GHCR="$host_ip:5002" \
        --build-arg MCR="$host_ip:5004" \
        --build-arg UV_VERSION="$UV_VERSION" \
        --build-arg PYTHON_VERSION="$PYTHON_VERSION" \
        --build-arg DOTNET_VERSION="$DOTNET_VERSION" \
        --cache-from "type=registry,ref=$CACHE:$CI_COMMIT_REF_SLUG" \
        --cache-from "type=registry,ref=$CACHE:$CI_DEFAULT_BRANCH" \
        --cache-to "type=registry,ref=$CACHE:$CI_COMMIT_REF_SLUG,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true" \
        -t "$IMAGE" $output .

ontology-image:
  extends: .image
  needs: [ontology, deps-python]
  rules:
    - changes: *changes-ontology
  cache:
    - <<: *cache-uv
      policy: pull
  variables:
    SERVICE: ontology
    CONTEXTS: --build-context uv-cache=.uv-cache

consult-image:
  extends: .image
  needs: [consult, deps-python]
  rules:
    - changes: *changes-consult
  cache:
    - <<: *cache-uv
      policy: pull
  variables:
    SERVICE: consult
    CONTEXTS: --build-context uv-cache=.uv-cache

platform-image:
  extends: .image
  needs: [dotnet, openapi, deps-dotnet]
  rules:
    - changes: *changes-platform
  cache:
    - <<: *cache-nuget
      policy: pull
  variables:
    SERVICE: platform
    CONTEXTS: --build-context nuget=.nuget/packages

segmenter:
  extends: .python-checks
  rules:
    - changes: *changes-segmenter
  # 不需資料庫。CI 只驗契約（同一份詞典得到同一個 tokenizer id 與同一批 token）；
  # 斷詞品質由 scripts/measure-segmentation.py 量測，需要網路，不在 CI 跑。
  variables:
    MEMBER: libs/python/env-law-segmenter

# 對外 REST 的相容性檢查（同 proto 的 buf breaking），以目標分支已提交的規格為基準；規格與程式碼是否一致由 dotnet job 檢查。
openapi:
  extends: .runner
  stage: check
  rules:
    - changes: *changes-platform
  image:
    name: tufin/oasdiff:$OASDIFF_VERSION
    entrypoint: [""]
  variables:
    SPEC: services/platform/openapi/openapi_v2.json
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        echo "非 MR pipeline，不執行相容性檢查"
      elif git fetch -q --depth=1 origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" && git show "FETCH_HEAD:$SPEC" > /tmp/base.json 2>/dev/null; then
        oasdiff breaking /tmp/base.json "$SPEC" --fail-on ERR
      else
        echo "目標分支 ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME} 尚無 $SPEC，無基準可比——跳過相容性檢查"
      fi

proto:
  extends: .runner
  stage: check
  rules:
    - changes: *changes-proto
  image:
    name: bufbuild/buf:$BUF_VERSION
    entrypoint: [""]
  script:
    - buf lint
    # 目標分支尚無 proto 模組時沒有基準可比，明示跳過，不靜默通過。
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        echo "非 MR pipeline，不執行相容性檢查"
      elif buf build "${CI_REPOSITORY_URL}#branch=${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" -o /dev/null >/dev/null 2>&1; then
        buf breaking --against "${CI_REPOSITORY_URL}#branch=${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
      else
        echo "目標分支 ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME} 尚無 proto 模組，無基準可比——跳過相容性檢查"
      fi

dockerfile:
  extends: .runner
  stage: check
  rules:
    - changes: *changes-dockerfile
  image:
    name: hadolint/hadolint:$HADOLINT_VERSION-alpine
    entrypoint: [""]
  script:
    - hadolint services/*/Dockerfile
