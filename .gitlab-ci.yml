# CI for env-law（單一倉庫、多服務）。
#
# 免費層每月 400 分鐘，所以 job 用 `rules:changes` 依路徑分流：只改文件不會跑 dotnet
# 與 python，只改一個服務不會跑另一個。proto 同時是兩個服務的上游，故列入兩者的
# 觸發路徑——契約一改，兩邊都要重驗，這正是把它們放進同一個倉庫的理由。
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true

stages:
  - check

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  UV_VERSION: "0.12.17"
  PYTHON_VERSION: "3.14"
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache

.changes-platform: &changes-platform
  - services/platform/**/*
  - proto/**/*
  - .gitlab-ci.yml

.changes-ontology: &changes-ontology
  - services/ontology/**/*
  - libs/python/**/*
  - proto/**/*
  - .gitlab-ci.yml

.changes-consult: &changes-consult
  - services/consult/**/*
  - libs/python/**/*
  - proto/**/*
  - .gitlab-ci.yml

.changes-deploy: &changes-deploy
  - deploy/**/*
  - .gitlab-ci.yml

.changes-proto: &changes-proto
  - proto/**/*
  - buf.yaml
  - .gitlab-ci.yml

dotnet:
  stage: check
  rules:
    - changes: *changes-platform
  image: mcr.microsoft.com/dotnet/sdk:10.0
  # Testcontainers（PostgreSQL）走 Docker-in-Docker；gitlab.com 託管 Linux runner 為 privileged。
  services:
    - name: docker:29.8.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages
  cache:
    - key:
        files: [services/platform/Directory.Packages.props]
      paths: [.nuget/packages]
  script:
    - cd services/platform
    - dotnet restore
    - dotnet build --no-restore
    - dotnet format --verify-no-changes --no-restore
    - >-
      dotnet test --no-build
      --logger "junit;LogFilePath=$CI_PROJECT_DIR/artifacts/{assembly}-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
  artifacts:
    when: always
    paths:
      - artifacts/*test-result.xml
    reports:
      junit: artifacts/*test-result.xml

python:
  stage: check
  rules:
    - changes: *changes-ontology
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-trixie-slim
  # 測試需要真實的 PostgreSQL（本服務一半的讀取邏輯在 SQL 裡）。用 job service 直接
  # 附掛一個，而不是 Docker-in-Docker 再由 testcontainers 起——後者要多跑一個 dind
  # 服務、多拉一次映像，在每月 400 分鐘的額度下是純損失。testcontainers 仍留在開發
  # 相依裡，供本機沒有現成資料庫時使用。
  services:
    - name: postgres:18-alpine
      alias: postgres
  variables:
    POSTGRES_DB: env_law_test
    POSTGRES_USER: env_law
    POSTGRES_PASSWORD: env_law
    ONTOLOGY_TEST_DSN: "postgresql://env_law:env_law@postgres:5432/env_law_test"
  cache:
    - key:
        files: [services/ontology/uv.lock]
      paths: [services/ontology/$UV_CACHE_DIR]
  script:
    - cd services/ontology
    - uv sync --locked
    - uv run --no-sync ruff check .
    - uv run --no-sync ruff format --check .
    - uv run --no-sync mypy src tests
    # 產生碼必須與根 proto/ 一致（重新產生後比對）。
    - cp -r src/env_law/ontology "$CI_PROJECT_DIR/.generated-before"
    - ./scripts/generate-proto.sh
    - diff -r "$CI_PROJECT_DIR/.generated-before" src/env_law/ontology
    - uv run --no-sync pytest --junitxml="$CI_PROJECT_DIR/report.xml"
  after_script:
    - cd services/ontology && uv cache prune --ci
  artifacts:
    when: always
    reports:
      junit: report.xml

consult:
  stage: check
  rules:
    - changes: *changes-consult
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-trixie-slim
  cache:
    - key:
        files: [services/consult/uv.lock]
      paths: [services/consult/$UV_CACHE_DIR]
  script:
    - cd services/consult
    - uv sync --locked
    - uv run --no-sync ruff check .
    - uv run --no-sync ruff format --check .
    - uv run --no-sync mypy src tests
    - cp -r src/env_law/consult/v1 "$CI_PROJECT_DIR/.generated-before"
    - ./scripts/generate-proto.sh
    - diff -r "$CI_PROJECT_DIR/.generated-before" src/env_law/consult/v1
    - uv run --no-sync pytest --junitxml="$CI_PROJECT_DIR/consult-report.xml"
  after_script:
    - cd services/consult && uv cache prune --ci
  artifacts:
    when: always
    reports:
      junit: consult-report.xml

deploy:
  stage: check
  rules:
    - changes: *changes-deploy
  image: alpine:3.22
  # 無叢集可用，故驗到能驗的極限：kustomize 建得起來，且所有物件（含 CloudNativePG
  # 的 CRD）通過嚴格綱要驗證。這**不等於** API server 收得下——真正的 --dry-run=server
  # 要等叢集存在，屆時應改為對它驗證。
  before_script:
    - apk add --no-cache curl tar
    - curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
    - curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin kubeconform
  script:
    - kustomize build deploy/base > /tmp/manifests.yaml
    - |
      kubeconform -strict -summary \
        -schema-location default \
        -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
        /tmp/manifests.yaml

proto:
  stage: check
  rules:
    - changes: *changes-proto
  image:
    name: bufbuild/buf:1.73.0
    entrypoint: [""]
  script:
    - buf lint
    # 相容性檢查需要一個基準。目標分支尚未含 proto 模組時（例如把契約移進倉庫的
    # 那一次變更本身），沒有任何既有消費端可被破壞，故明示跳過並印出理由——不要
    # 靜默通過，也不要因此永久放寬檢查。
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        echo "非 MR pipeline，不執行相容性檢查"
      elif buf build "${CI_REPOSITORY_URL}#branch=${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" -o /dev/null >/dev/null 2>&1; then
        buf breaking --against "${CI_REPOSITORY_URL}#branch=${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
      else
        echo "目標分支 ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME} 尚無 proto 模組，無基準可比——跳過相容性檢查"
      fi
