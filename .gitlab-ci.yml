# envcite 單一倉庫的 CI，以 `rules:changes` 依路徑分流。proto 是各服務的上游，列入其觸發路徑。
# 除 gate 走 shared runner 外，job 都用自建 runner `windows-docker-thin`（不計 GitLab.com 分鐘數）。
#
# 檢查只在 MR pipeline 跑，預設分支只建置映像（與 gate、掃描）。前提：合併方式為 Fast-forward 並開啟
# 「合併前自動 rebase」，MR pipeline 測的就是合併後的結果。前提若被改掉，要把檢查加回預設分支。
# 映像 job 因此只等依賴（`deps-*`），不等同一 MR 的檢查：兩者平行，總時間取較長者而非相加；
# 檢查失敗時 `on_job_failure: all` 會取消映像建置。
include:
  - component: $CI_SERVER_FQDN/components/secret-detection/secret-detection@2.4.0
    inputs:
      stage: check
      enable_mr_pipelines: true
  - component: $CI_SERVER_FQDN/components/sast/sast@3.5.0
    inputs:
      stage: check
      enable_mr_pipelines: true
  # 鎖檔（uv.lock、packages.lock.json）已存在，不需要解析依賴的 job；深度要夠到 services/platform/src/<專案>/。
  - component: $CI_SERVER_FQDN/components/dependency-scanning/main@2.1.1
    inputs:
      stage: check
      max_scan_depth: 6
      disabled_resolution_jobs: "maven,gradle,python"

# 掃描與 gate 跑在 GitLab 的 shared runner，不用等 prepare 階段的 deps-*：立刻開始，失敗也更早取消同
# pipeline 其餘 job。
secret_detection:
  needs: []
semgrep-sast:
  needs: []
dependency-scanning:
  needs: []

workflow:
  # 沒開 MR 的功能分支不跑 CI；不留 branch pipeline，否則先 push 再開 MR 會同一 SHA 跑兩條，
  # 搶唯一的 runner。要驗證就開 MR（`git push -o merge_request.create`）。
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # 預設分支不自動取消：中途取消會少掉該 commit 的映像 tag。
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      auto_cancel:
        on_new_commit: none
  # 同一 MR 的新 commit 取消舊 pipeline（job 須 interruptible，見 default）。
  # 一個 job 失敗就取消同 pipeline 其餘 job：唯一的 runner 不該把時間花在已注定紅的 pipeline。
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all

default:
  interruptible: true
  # 只重試 runner 的暫時性失敗；測試失敗不重試。
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_pending_with_matching_runners
      - stuck_pending_no_matching_runners
      - no_updates_running
      - no_updates_canceling
  timeout: 30m

stages:
  - prepare
  - check
  - build

variables:
  # 工具與映像版本集中於此，`# renovate:` 註記供 Renovate 更新。
  # renovate: datasource=docker depName=docker
  DOCKER_VERSION: "29.8.1"
  # renovate: datasource=docker depName=bufbuild/buf
  BUF_VERSION: "1.73.0"
  # renovate: datasource=docker depName=tufin/oasdiff
  OASDIFF_VERSION: "v1.32.1"
  # renovate: datasource=docker depName=hadolint/hadolint
  HADOLINT_VERSION: "v2.15.1"
  # renovate: datasource=docker depName=alpine
  ALPINE_VERSION: "3.22"
  # renovate: datasource=docker depName=postgres
  POSTGRES_MAJOR: "18"
  # 用完整版本：套件快取隨 SDK 版本，快取鍵帶這個值；Dockerfile 的 ARG 與此同步（Renovate 兩處都追蹤）。
  # renovate: datasource=docker depName=mcr.microsoft.com/dotnet/sdk
  DOTNET_VERSION: "10.0.403"
  # renovate: datasource=pypi depName=uv
  UV_VERSION: "0.12.18"
  # renovate: datasource=python-version depName=python
  PYTHON_VERSION: "3.14"
  # 只用來驗證 renovate.json；更新由 thuaisse-lab/chepb-1150011621 的排程執行（版本各自升），
  # 驗證通過但執行端較舊時，以執行端的 log 為準。
  # renovate: datasource=docker depName=renovate/renovate
  RENOVATE_VERSION: "43.272.4"
  # NuGet Audit 的弱點查詢繞過 Nexus 直連 api.nuget.org，逾時會讓 restore 失敗（NU1900，
  # TreatWarningsAsErrors 下是錯誤）。CI 關閉；弱點由 Renovate 的 osvVulnerabilityAlerts 監控。
  NuGetAudit: "false"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  COVERAGE_RCFILE: $CI_PROJECT_DIR/pyproject.toml
  UV_LINK_MODE: copy
  # 絕對路徑：job 會 cd 進成員目錄。
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache

# 依賴只在 prepare 階段由 deps-* 下載一次，其餘 job 以 `policy: pull` 離線執行：缺套件立刻失敗，
# 不各自連外網。
# NuGet 的 key 綁套件清單與工具清單（dotnet-ef 的版本）的雜湊，兩者沒變則所有分支共用；冷啟動要下載
# 約 170 MB，時間隨頻寬而定。工具清單要在 key 裡：同 key 的快取已存在時 runner 不再上傳，工具升版而
# key 不變，下游映像建置會讀到缺工具的舊快取。
# key 帶專案路徑：runner 的 S3 cache 為 Shared，同 key 會跨專案共用。
.cache-nuget: &cache-nuget
  key:
    prefix: "$CI_PROJECT_PATH-sdk$DOTNET_VERSION"
    files: [Directory.Packages.props, services/platform/dotnet-tools.json]
  paths: [.nuget/packages]

# uv 的 key 綁 uv.lock 的雜湊，理由同 NuGet。
.cache-uv: &cache-uv
  key:
    prefix: "$CI_PROJECT_PATH"
    files: [uv.lock]
  paths: [.uv-cache]

# `rules:changes` 沒有排除語法，故列「影響建置與測試的路徑」而非整個服務目錄，只改 Markdown 或
# `.env.example` 不啟動 CI。服務新增頂層程式或設定檔時要補進對應清單，否則不會觸發。
# .NET 成員共用倉庫根的 SDK、套件版本、建置屬性與程式碼風格，以及 libs/dotnet，一改就全部重驗。
.changes-platform: &changes-platform
  - services/platform/src/**/*
  - services/platform/tests/**/*
  - services/platform/openapi/**/*
  - services/platform/.editorconfig
  - services/platform/Dockerfile*
  - services/platform/EnvCite.Platform.slnx
  - services/platform/dotnet-tools.json
  - libs/dotnet/**/*
  - global.json
  - Directory.*
  - .editorconfig
  - proto/**/*

# uv workspace 共用根目錄的 pyproject.toml 與 uv.lock，一改就全部重驗。
.changes-ontology: &changes-ontology
  - services/ontology/src/**/*
  - services/ontology/tests/**/*
  - services/ontology/migrations/**/*
  - services/ontology/tools/**/*
  - services/ontology/Dockerfile*
  - services/ontology/models.example.toml
  - services/ontology/pyproject.toml
  - libs/python/*/src/**/*
  - libs/python/*/tests/**/*
  - libs/python/*/scripts/**/*
  - libs/python/*/pyproject.toml
  - proto/**/*
  - pyproject.toml
  - uv.lock

.changes-consult: &changes-consult
  - services/consult/src/**/*
  - services/consult/tests/**/*
  - services/consult/Dockerfile*
  - services/consult/EnvCite.Consult.slnx
  - libs/dotnet/**/*
  - global.json
  - Directory.*
  - .editorconfig
  - proto/**/*

# 所有 .NET job 的觸發路徑聯集：deps-dotnet 在其中任何一個 job 要跑時就要跑。
.changes-dotnet: &changes-dotnet
  - services/platform/src/**/*
  - services/platform/tests/**/*
  - services/platform/openapi/**/*
  - services/platform/.editorconfig
  - services/platform/Dockerfile*
  - services/platform/EnvCite.Platform.slnx
  - services/platform/dotnet-tools.json
  - services/consult/src/**/*
  - services/consult/tests/**/*
  - services/consult/Dockerfile*
  - services/consult/EnvCite.Consult.slnx
  - libs/dotnet/**/*
  - global.json
  - Directory.*
  - .editorconfig
  - proto/**/*

.changes-segmenter: &changes-segmenter
  - libs/python/envcite-segmenter/src/**/*
  - libs/python/envcite-segmenter/tests/**/*
  - libs/python/envcite-segmenter/scripts/**/*
  - libs/python/envcite-segmenter/pyproject.toml
  - pyproject.toml
  - uv.lock

.changes-python-proto: &changes-python-proto
  - libs/python/envcite-proto/src/**/*
  - libs/python/envcite-proto/scripts/**/*
  - libs/python/envcite-proto/pyproject.toml
  - proto/**/*
  - pyproject.toml
  - uv.lock

.changes-jobkit: &changes-jobkit
  - libs/python/envcite-jobkit/src/**/*
  - libs/python/envcite-jobkit/tests/**/*
  - libs/python/envcite-jobkit/pyproject.toml
  - pyproject.toml
  - uv.lock

# 所有 Python job 的觸發路徑聯集：deps-python 在其中任何一個 job 要跑時就要跑。
.changes-python: &changes-python
  - services/ontology/src/**/*
  - services/ontology/tests/**/*
  - services/ontology/migrations/**/*
  - services/ontology/tools/**/*
  - services/ontology/Dockerfile*
  - services/ontology/models.example.toml
  - services/ontology/pyproject.toml
  - libs/python/*/src/**/*
  - libs/python/*/tests/**/*
  - libs/python/*/scripts/**/*
  - libs/python/*/pyproject.toml
  - proto/**/*
  - pyproject.toml
  - uv.lock

.changes-dockerfile: &changes-dockerfile
  - services/*/Dockerfile

.changes-proto: &changes-proto
  - proto/**/*
  - buf.yaml

# `.gitlab-ci.yml` 不在上面任何清單：它只在 MR 觸發驗證（見各 job 的 `*mr-ci-change`），預設分支不因它
# 重跑依賴與映像建置，否則只改註解也會推出新 SHA 的映像並觸發 Image Updater。
.mr-ci-change: &mr-ci-change
  if: $CI_PIPELINE_SOURCE == "merge_request_event"
  changes: [.gitlab-ci.yml]

# 自建 runner 的 tag 只在這裡定義。
.runner:
  tags: [windows-docker-thin]

# Docker-in-Docker：dotnet 的 Testcontainers 與映像建置共用。
.dind:
  services:
    - name: docker:${DOCKER_VERSION}-dind
      alias: docker
      # buildkit 從 runner 主機的 registry 快取（http）拉取，dockerd 須放行私網位址。
      command:
        - --insecure-registry=10.0.0.0/8
        - --insecure-registry=172.16.0.0/12
        - --insecure-registry=192.168.0.0/16
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

# 只改文件的 MR 不符合任何 `rules:changes`，而合併要求 pipeline 成功：此 job 讓 pipeline 永遠存在。
gate:
  stage: check
  needs: []
  image: alpine:$ALPINE_VERSION
  variables:
    GIT_STRATEGY: none
  script:
    - echo "path-specific jobs below decide what else runs"

# renovate.json 壞了只會開 issue、更新靜默停擺：在 MR 擋下。映像首次拉取約 0.4 GB，timeout 放寬。
renovate-config:
  extends: .runner
  stage: check
  image:
    name: renovate/renovate:$RENOVATE_VERSION
    # 清空 ENTRYPOINT 才能跑 script。
    entrypoint: [""]
  needs: []
  timeout: 10m
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - renovate.json
  script:
    - renovate-config-validator --strict renovate.json

deps-dotnet:
  stage: prepare
  tags: [windows-docker-thin]
  # 套件由 Nexus 提供；冷啟動逾時後重跑會接著已快取的部分，不必另做續傳。
  timeout: 20m
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *changes-dotnet
    - *mr-ci-change
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *changes-dotnet
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  variables:
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages
  cache:
    - <<: *cache-nuget
  script:
    # 套件走 runner 主機的 Nexus（ci/nuget.mirror.config）；鏡像不可用就直接失敗，不退回上游
    # （失敗的請求也計入 Nexus 每日額度）。
    - timeout 10 bash -c '</dev/tcp/host.docker.internal/8081' || { echo "Nexus 鏡像（host.docker.internal:8081）不可用；請檢查 runner 主機上的 Nexus。" >&2; exit 1; }
    - mkdir -p ~/.nuget/NuGet && cp ci/nuget.mirror.config ~/.nuget/NuGet/NuGet.Config
    # 鎖檔釘住含間接依賴的完整依賴圖；與清單不一致即失敗。
    - (cd services/platform && dotnet restore --locked-mode)
    - (cd services/consult && dotnet restore --locked-mode)
    # 映像建置要的另一份（離線執行，只讀此快取），內容與 Dockerfile 同源；快取命中且輸入沒變就跳過，見腳本。
    - ci/prime-dotnet-image-cache.sh

# .NET 成員共用：離線 restore（套件已由 deps-dotnet 備妥），再在 `$MEMBER` 目錄跑檢查。
.dotnet:
  extends: .runner
  stage: check
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  needs: [deps-dotnet]
  variables:
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages
  cache:
    - <<: *cache-nuget
      policy: pull
  before_script:
    - cd "$MEMBER"
    # 來源指向空目錄，缺套件即失敗，不連外網。
    - mkdir -p "$CI_PROJECT_DIR/.nuget/no-source"
    - dotnet restore --locked-mode --source "$CI_PROJECT_DIR/.nuget/no-source"

.dotnet-test-report:
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - artifacts/*test-result.xml
    reports:
      junit: artifacts/*test-result.xml
      coverage_report:
        coverage_format: cobertura
        path: artifacts/**/coverage.cobertura*.xml

platform:
  extends: [.dotnet, .dind, .dotnet-test-report]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *changes-platform
    - *mr-ci-change
  variables:
    MEMBER: services/platform
    TESTCONTAINERS_HOST_OVERRIDE: docker
  script:
    - dotnet build --no-restore
    # openapi/ 由建置產生並提交；與程式碼不一致即失敗，重新建置後提交。
    - test -z "$(git status --porcelain -- openapi/)"
    - >-
      dotnet test --no-build
      --coverlet --coverlet-output-format cobertura
      --report-xunit-junit --report-xunit-junit-filename EnvCite.Platform.Tests-test-result.xml
      --results-directory "$CI_PROJECT_DIR/artifacts"

# 與測試互不依賴，拆開平行跑。
platform-format:
  extends: .dotnet
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *changes-platform
    - *mr-ci-change
  variables:
    MEMBER: services/platform
  script:
    - dotnet format --verify-no-changes --no-restore

# 規模小，建置、格式與測試在同一個 job。測試不需要資料庫，本體以行程內的 gRPC fake 取代。
consult:
  extends: [.dotnet, .dotnet-test-report]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *changes-consult
    - *mr-ci-change
  variables:
    MEMBER: services/consult
  script:
    - dotnet build --no-restore
    - dotnet format --verify-no-changes --no-restore
    - >-
      dotnet test --no-build
      --coverlet --coverlet-output-format cobertura
      --report-xunit-junit --report-xunit-junit-filename EnvCite.Consult.Tests-test-result.xml
      --results-directory "$CI_PROJECT_DIR/artifacts"

# Python 依賴：整個 workspace 一份 uv.lock，下載一次供所有 Python job 使用。
deps-python:
  stage: prepare
  tags: [windows-docker-thin]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *changes-python
    - *mr-ci-change
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *changes-python
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-trixie-slim
  cache:
    - <<: *cache-uv
  script:
    - uv sync --locked --all-packages
  after_script:
    # 不用 `--ci`：它會刪掉 wheel，而消費端離線需要它們。
    - uv cache prune

# Python 成員共用：同步整個 workspace（`--locked` 同時驗鎖檔與成員一致），再在 `$MEMBER` 目錄跑檢查。
.python:
  extends: .runner
  stage: check
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-trixie-slim
  needs: [deps-python]
  variables:
    UV_OFFLINE: "1"
  cache:
    - <<: *cache-uv
      policy: pull
  before_script:
    - uv sync --locked --all-packages
    - cd "$MEMBER"

.python-checks:
  extends: .python
  script:
    - uv run --no-sync ruff check .
    - uv run --no-sync ruff format --check .
    - uv run --no-sync mypy src tests
    - uv run --no-sync pytest --cov --cov-report=term --cov-report=xml:$CI_PROJECT_DIR/coverage.xml --junitxml="$CI_PROJECT_DIR/report.xml"
  coverage: '/^TOTAL\s.*\s(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

ontology:
  extends: .python-checks
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *changes-ontology
    - *mr-ci-change
  # 測試需要真實 PostgreSQL：以 job service 附掛（省掉 dind），主版本同正式區。
  services:
    - name: pgvector/pgvector:pg$POSTGRES_MAJOR
      alias: postgres
  variables:
    MEMBER: services/ontology
    POSTGRES_DB: envcite_test
    POSTGRES_USER: envcite
    POSTGRES_PASSWORD: envcite
    ONTOLOGY_TEST_DSN: "postgresql://envcite:envcite@postgres:5432/envcite_test"

# 重新產生後須與提交的產生碼一致。
python-proto:
  extends: .python
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *changes-python-proto
    - *mr-ci-change
  variables:
    MEMBER: libs/python/envcite-proto
  script:
    - cp -r src "$CI_PROJECT_DIR/.generated-before"
    - ./scripts/generate.sh
    - diff -r -x __pycache__ "$CI_PROJECT_DIR/.generated-before" src
    - uv run --no-sync mypy src

# 映像建置：MR 只驗證建置，預設分支才推送。tag 只用 commit SHA（不推 latest），部署庫的 Image Updater 依此上線。
.image:
  extends: [.runner, .dind]
  stage: build
  image: docker:$DOCKER_VERSION
  # 預設分支連續合併時同一服務的建置排隊、不同時跑；以分支 slug 區分，各 MR 的驗證建置互不排隊。
  resource_group: image-$SERVICE-$CI_COMMIT_REF_SLUG
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA
    # 層快取放 registry（dind 每次全新）；路徑與映像分開，避免被 Image Updater 當成新版本。
    CACHE: $CI_REGISTRY_IMAGE/cache/$SERVICE
  before_script:
    # registry.gitlab.com 偶發逾時：只對暫時性錯誤重試，見 ci/retry-transient.sh。
    - sh ci/retry-transient.sh sh -c 'echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"'
    # 匯出 registry 快取需要 docker-container driver，並用 host 網路：job 容器 MTU 1360、dind 橋接
    # 網路 1500，大封包被靜默丟棄（症狀：`dotnet restore` 連 api.nuget.org 逾時）。
    # 基底映像與 buildkit 映像都不直連上游：Dockerfile 的 FROM 以 build-arg 指向 runner 主機的
    # pull-through 快取（5000 docker.io、5002 ghcr.io、5004 mcr.microsoft.com），沒有就失敗。
    # 不用 BuildKit 的 mirror 設定，它找不到時會退回原 registry。位址取 host-gateway（buildkit 在
    # host 網路裡看不到 job 容器的 /etc/hosts）；buildkitd.toml 只用來放行這幾個 http 位址。
    # host_ip 留給下面的 script 用（同一個 shell）。
    - |
      host_ip=$(awk '/host\.docker\.internal/ {print $1; exit}' /etc/hosts)
      [ -n "$host_ip" ] || { echo "解析不到 host.docker.internal，無法使用 runner 主機的 registry 快取" >&2; exit 1; }
      for port in 5000 5002 5004; do
        printf '[registry."%s:%s"]\n  http = true\n  insecure = true\n' "$host_ip" "$port"
      done > buildkitd.toml
      docker buildx create --use --driver docker-container \
        --driver-opt "network=host,image=$host_ip:5000/moby/buildkit:buildx-stable-1" \
        --buildkitd-flags '--oci-worker-net=host' --buildkitd-config buildkitd.toml
  script:
    # 套件不在這裡下載：Dockerfile 的套件步驟以 `--network=none` 執行，只讀 deps-* 備好的快取
    # （經 $CONTEXTS 傳入），缺套件即失敗。層快取先讀本分支、再讀預設分支，各分支各寫各的，
    # 讀寫失敗不讓建置失敗。各 Dockerfile 只用部分 build-arg，多餘的只會警告。
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        output="--push"
      else
        echo "非預設分支，只驗證建置、不推送：$IMAGE"
        output="--output type=cacheonly"
      fi
      # 只對暫時性逾時（拉基底層、ghcr token、推送）重試，建置失敗照舊立刻紅；重試時層快取已在 registry。
      sh ci/retry-transient.sh docker buildx build -f services/$SERVICE/Dockerfile $CONTEXTS \
        --build-arg DOCKER_HUB="$host_ip:5000" \
        --build-arg GHCR="$host_ip:5002" \
        --build-arg MCR="$host_ip:5004" \
        --build-arg UV_VERSION="$UV_VERSION" \
        --build-arg PYTHON_VERSION="$PYTHON_VERSION" \
        --build-arg DOTNET_VERSION="$DOTNET_VERSION" \
        --cache-from "type=registry,ref=$CACHE:$CI_COMMIT_REF_SLUG" \
        --cache-from "type=registry,ref=$CACHE:$CI_DEFAULT_BRANCH" \
        --cache-to "type=registry,ref=$CACHE:$CI_COMMIT_REF_SLUG,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true" \
        -t "$IMAGE" $output .

ontology-image:
  extends: .image
  needs: [deps-python]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *changes-ontology
    - *mr-ci-change
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *changes-ontology
      # 推映像的建置不可被中斷，作為 on_new_commit: none 之外的保險。
      interruptible: false
  cache:
    - <<: *cache-uv
      policy: pull
  variables:
    SERVICE: ontology
    CONTEXTS: --build-context uv-cache=.uv-cache

consult-image:
  extends: .image
  needs: [deps-dotnet]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *changes-consult
    - *mr-ci-change
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *changes-consult
      # 推映像的建置不可被中斷，作為 on_new_commit: none 之外的保險。
      interruptible: false
  cache:
    - <<: *cache-nuget
      policy: pull
  variables:
    SERVICE: consult
    CONTEXTS: --build-context nuget=.nuget/packages

platform-image:
  extends: .image
  needs: [deps-dotnet]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *changes-platform
    - *mr-ci-change
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *changes-platform
      # 推映像的建置不可被中斷，作為 on_new_commit: none 之外的保險。
      interruptible: false
  cache:
    - <<: *cache-nuget
      policy: pull
  variables:
    SERVICE: platform
    CONTEXTS: --build-context nuget=.nuget/packages

segmenter:
  extends: .python-checks
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *changes-segmenter
    - *mr-ci-change
  # 不需資料庫。CI 只驗契約（同詞典得到同 tokenizer id 與同批 token）；斷詞品質由
  # scripts/measure-segmentation.py 量測（需網路，不在 CI）。
  variables:
    MEMBER: libs/python/envcite-segmenter

jobkit:
  extends: .python-checks
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *changes-jobkit
    - *mr-ci-change
  # 純標準庫、不需資料庫與網路；時鐘可注入，測試不真的等待。
  variables:
    MEMBER: libs/python/envcite-jobkit

# 對外 REST 的相容性檢查（同 proto 的 buf breaking），以目標分支已提交的規格為基準；規格與程式碼是否一致由 platform job 檢查。
openapi:
  extends: .runner
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *changes-platform
    - *mr-ci-change
  image:
    name: tufin/oasdiff:$OASDIFF_VERSION
    entrypoint: [""]
  variables:
    SPEC: services/platform/openapi/openapi_v2.json
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        echo "非 MR pipeline，不執行相容性檢查"
      elif git fetch -q --depth=1 origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" && git show "FETCH_HEAD:$SPEC" > /tmp/base.json 2>/dev/null; then
        # 刻意的破壞性變更由 MR 的 api-breaking 標籤宣告：只放行這一個 MR，照樣列出破壞處供審查；
        # 標籤在 pipeline 建立時讀取，事後才加要重跑 pipeline。
        if printf ',%s,' "$CI_MERGE_REQUEST_LABELS" | grep -q ',api-breaking,'; then
          oasdiff breaking /tmp/base.json "$SPEC"
        else
          oasdiff breaking /tmp/base.json "$SPEC" --fail-on ERR
        fi
      else
        echo "目標分支 ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME} 尚無 $SPEC，無基準可比——跳過相容性檢查"
      fi

proto:
  extends: .runner
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *changes-proto
    - *mr-ci-change
  image:
    name: bufbuild/buf:$BUF_VERSION
    entrypoint: [""]
  script:
    - buf lint
    # 目標分支尚無 proto 模組時沒有基準可比，明示跳過，不靜默通過。
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        echo "非 MR pipeline，不執行相容性檢查"
      elif buf build "${CI_REPOSITORY_URL}#branch=${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" -o /dev/null >/dev/null 2>&1; then
        buf breaking --against "${CI_REPOSITORY_URL}#branch=${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
      else
        echo "目標分支 ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME} 尚無 proto 模組，無基準可比——跳過相容性檢查"
      fi

# ci/ 腳本與 .githooks/block-main.sh 的離線測試（假指令、暫時 repo，不連網）：映像 job 的重試與 main 守門靠它，壞了等於沒守門。
ci-scripts:
  extends: .runner
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ci/*.sh
        - .githooks/*
        - .gitlab-ci.yml
  image: alpine:$ALPINE_VERSION
  variables:
    GIT_DEPTH: "1"
  script:
    - apk add --no-cache git jq
    - sh ci/test-retry-transient.sh
    - sh ci/test-block-main.sh

# 文件 front-matter 與相對連結（規範見容器層 AGENTS.md「知識文件」）：不退化靠 CI 擋。純標準庫腳本。
docs:
  extends: .runner
  stage: check
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.md"
        - ci/check-docs.py
  image: python:$PYTHON_VERSION-alpine
  variables:
    GIT_DEPTH: "1"
  script:
    - python ci/check-docs.py

dockerfile:
  extends: .runner
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *changes-dockerfile
    - *mr-ci-change
  image:
    name: hadolint/hadolint:$HADOLINT_VERSION-alpine
    entrypoint: [""]
  script:
    - hadolint services/*/Dockerfile
