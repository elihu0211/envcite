# 本機開發用 PostgreSQL：docker compose up -d
#
# 專案名固定為 env-law：各 worktree 目錄不同，不固定的話每棵樹會各起一個庫、搶同一個
# port。一台機器一個庫，各分支以資料庫名區分（.config/wt.toml）。
#
# 映像與 ontology 測試相同（services/ontology/tests/conftest.py），內含 vector 與
# btree_gist。帳密是本機值，與 appsettings.Development.json、scripts/worktree-db.py 一致。
name: env-law

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"   # 只綁本機，不對區網開放
    volumes:
      - pgdata:/var/lib/postgresql   # PostgreSQL 18 起映像的資料目錄在此之下（PGDATA=/var/lib/postgresql/18/docker）
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
