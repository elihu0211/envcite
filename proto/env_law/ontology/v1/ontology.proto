syntax = "proto3";

package env_law.ontology.v1;

option csharp_namespace = "EnvLaw.Ontology.V1";

// Read access to the environmental-law ontology (ELI-based RDF/OWL).
// Internal service: callers must send `authorization: Bearer <internal token>`.
// Optional metadata: `x-tenant-id`, `x-request-id` (logging/audit only; data is not tenant-scoped).
service OntologyService {
  // Returns one law (ELI LegalResource) by its local id, or NOT_FOUND.
  rpc GetLaw(GetLawRequest) returns (GetLawResponse);
  // Lists the articles (ELI LegalResourceSubdivision) of a law in reading order, or NOT_FOUND.
  rpc ListArticles(ListArticlesRequest) returns (ListArticlesResponse);
}

message Law {
  // Note: `title` and `date_document` below describe the resolved version, not the
  // abstract norm — ELI puts the title on the expression, which is version-bearing.
  // Local id, e.g. "air-pollution-control-act" (lowercase letters, digits, hyphens).
  string id = 1;
  // Canonical IRI of the ELI LegalResource.
  string iri = 2;
  // Title from the LegalExpression realizing this law.
  string title = 3;
  // BCP 47 language tag of the title, e.g. "zh-hant".
  string language = 4;
  // eli:date_document as ISO 8601 date (YYYY-MM-DD); empty if unknown.
  string date_document = 5;
}

message Article {
  string iri = 1;
  // eli:number as written, e.g. "1", "5-1" (第5條之1).
  string number = 2;
}

message GetLawRequest {
  string id = 1;
  // Resolve the law as in force on this date (ISO 8601). Empty means "as
  // currently in force". When the corpus holds no version covering the date the
  // call is NOT_FOUND — never the current text, which would be indistinguishable
  // from a correct answer.
  string as_of = 2;
}

message GetLawResponse {
  Law law = 1;
}

message ListArticlesRequest {
  string law_id = 1;
  // See GetLawRequest.as_of.
  string as_of = 2;
}

message ListArticlesResponse {
  repeated Article articles = 1;
}
