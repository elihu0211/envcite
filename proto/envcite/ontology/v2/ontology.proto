syntax = "proto3";

package envcite.ontology.v2;

option csharp_namespace = "EnvCite.Ontology.V2";

// 環境法規本體的唯讀存取（關聯式，PostgreSQL）。
//
// 內部服務，認證由叢集的服務網格負責。
// 選填 metadata：`x-tenant-id`、`x-request-id`，只用於日誌與稽核；資料不分租戶。
service OntologyService {
  // 依自然鍵複合標識取得一部法規；不存在回 NOT_FOUND。
  rpc GetLaw(GetLawRequest) returns (GetLawResponse);

  // 依閱讀順序列出一部法規的條文；法規不存在回 NOT_FOUND。
  rpc ListArticles(ListArticlesRequest) returns (ListArticlesResponse);

  // 在 `as_of` 當日有效的條文上做混合檢索，相關度由高到低。查詢是原始文字，
  // 由服務以建索引時的斷詞器自行斷詞：呼叫端若自行斷詞，會悄悄比對到較少的列。
  rpc SearchArticles(SearchArticlesRequest) returns (SearchArticlesResponse);

  // `as_of` 當日因大法官解釋或憲法法庭判決而失效的條文單元（違憲失效）。法規不存在或
  // 該日無施行版本的回應同 GetLaw。
  rpc ListInvalidations(ListInvalidationsRequest) returns (ListInvalidationsResponse);

  // 列出語料庫中在 `as_of` 當日有有效版本的法規摘要與授權母法關聯，供瀏覽法規階層樹。
  rpc ListLaws(ListLawsRequest) returns (ListLawsResponse);

  // 取得以特定法規為焦點（或依分類總覽）的多層授權知識圖譜、條文義務罰則連動與函釋錨點。
  rpc GetLawGraph(GetLawGraphRequest) returns (GetLawGraphResponse);

  // 依條文版本標準 IRI（索引）取得單一條文全文與中繼資料；IRI 格式錯誤回 INVALID_ARGUMENT，查無回 NOT_FOUND。
  rpc GetArticleByIri(GetArticleByIriRequest) returns (GetArticleByIriResponse);
}

// 法規的複合自然鍵（管轄，識別碼方案，在地識別碼）。三個欄位都必填，沒有預設：
// 缺少任一個回 INVALID_ARGUMENT（`EMPTY`），值不在下列集合內也是 INVALID_ARGUMENT（`UNKNOWN_VALUE`）。
message LawIdentifier {
  // 管轄代號：'TW-CENTRAL'（中央）或 ISO 3166-2:TW 的 22 個縣市代碼（'TW-TPE'、'TW-NWT'、
  // 'TW-TAO'、'TW-TXG'、'TW-TNN'、'TW-KHH'、'TW-KEE'、'TW-HSZ'、'TW-CYI'、'TW-HSQ'、'TW-MIA'、
  // 'TW-CHA'、'TW-NAN'、'TW-YUN'、'TW-CYQ'、'TW-PIF'、'TW-ILA'、'TW-HUA'、'TW-TTT'、'TW-PEN'、
  // 'TW-KIN'、'TW-LIE'）。縣市管轄是契約預留，目前沒有取得來源。
  string jurisdiction = 1;

  // 方案代號：'moj_pcode'（全國法規資料庫 pcode，只配 'TW-CENTRAL'）或 'local_glrs'（地方法規，
  // 只配縣市；契約預留，目前沒有取得來源）。不合法的配對不存在於語料，查詢回 NOT_FOUND。
  string id_scheme = 2;

  // 在地識別碼，在（管轄，方案）之內唯一。
  string local_id = 3;
}

message Law {
  // 複合自然鍵識別碼。
  LawIdentifier identifier = 1;

  // 法規的標準 IRI。
  string iri = 2;

  // `as_of` 所解析版本的標題。標題屬於公布的版本而非法規本身：修正可能改名。
  string title = 3;

  // 標題的 ISO 639-3 語言代碼，例如 "zho"（IRI 中也用同一代碼）。
  string language = 4;

  // 制定日（ISO 8601）；語料沒有制定紀錄時為空。
  string date_document = 5;

  // 曾有核定機關、核定文號、核定日、失效依據與失效日欄位，語料沒有任何來源填它們而移除；
  // 違憲失效以 ListInvalidations 取得。
  reserved 6 to 10;
  reserved "approval_authority", "approval_doc_no", "ratified_at", "invalidated_by",
      "invalidation_date";
}

message Article {
  string iri = 1;

  // 條號，依原文書寫，例如 "1"、"5-1"（第 5 條之 1）。
  string number = 2;

  // 與 StructureHeading.sort_key 共用的整數陣列排序鍵；依閱讀順序交錯組樹。
  repeated int32 sort_key = 3;
}

enum HeadingKind {
  HEADING_KIND_UNSPECIFIED = 0;
  HEADING_KIND_PART = 1;
  HEADING_KIND_CHAPTER = 2;
  HEADING_KIND_SECTION = 3;
  HEADING_KIND_SUBSECTION = 4;
  HEADING_KIND_ITEM_HEADING = 5;
}

message StructureHeading {
  HeadingKind kind = 1;
  string heading_no = 2;
  string title = 3;
  repeated int32 sort_key = 4;
  // 在 ListArticlesResponse.headings 中的父節點索引；頂層節點為 -1。
  int32 parent_index = 5;
}

message GetLawRequest {
  LawIdentifier identifier = 1;

  // 依哪一天施行的版本解析（ISO 8601）。留空為現行。語料沒有版本涵蓋該日時
  // 回 NOT_FOUND，絕不回現行文字：那會與正確答案無從分辨。
  string as_of = 2;
}

message GetLawResponse {
  Law law = 1;
}

message ListArticlesRequest {
  LawIdentifier identifier = 1;

  // 見 GetLawRequest.as_of。
  string as_of = 2;
}

message ListArticlesResponse {
  repeated Article articles = 1;
  repeated StructureHeading headings = 2;
}

message SearchArticlesRequest {
  // 查詢原文，不要自行斷詞或改寫。
  string query = 1;

  // 見 GetLawRequest.as_of。
  string as_of = 2;

  // 最多回傳幾筆；0 為服務預設值。
  int32 limit = 3;

  // 可選管轄過濾：留空為全部管轄；有值須是 LawIdentifier.jurisdiction 的合法值，否則 INVALID_ARGUMENT。
  string jurisdiction = 4;

  // 把函釋提到查詢詞的條文也納入：查詢以空白分成詞組（最多 5 個，每個 2 至 30 字），主旨或內文含每個詞組、
  // 在 `as_of` 有效的函釋，所解釋的條文（`guidance_documents` > 0）與兩臂的結果以名次倒數融合，
  // 最多比 `limit` 多回 5 條。詞組出現在太多函釋裡時（命中的函釋占可用函釋的比例超過服務的設定）指不出哪幾條，
  // 這個查詢不納入函釋。函釋只用來找條文，不是推論的前提；預設不納入，不影響其他呼叫端的結果。
  bool include_guidance = 5;

  // 兩臂（與函釋）取到的候選再交給交叉編碼器精排，取前 `limit` 條：比只重排前 `limit` 條多看深一些的候選，
  // 所以不只改次序，也讓原本落在 `limit` 之外的相關條文進來。候選條數與名額由服務設定；服務沒有宣告精排模型、
  // 名額滿了、或精排端點逾時或失敗時，退回沒有精排的次序、`rerank_score` 不設，查詢仍成功，不回錯誤。
  // 精排多一次對外呼叫，延遲以秒計，所以預設不精排，不影響其他呼叫端的結果與延遲。
  bool rerank = 6;
}

message SearchArticlesResponse {
  // 相關度由高到低：字面臂與語意臂以名次倒數融合。
  repeated ArticleHit hits = 1;
}

message ArticleHit {
  string iri = 1;
  LawIdentifier identifier = 2;

  // `as_of` 當日有效版本的法規標題。
  string law_title = 3;

  // 條號，依原文書寫，例如 "5-1"。
  string number = 4;

  string content = 5;

  // 字面臂的原始分數（ts_rank_cd）；字面臂沒有命中這一條時為 0。只在同一次查詢之內可比較。
  float lexical_score = 6;

  // 語意臂的餘弦相似度（-1 至 1）；語意臂沒有命中這一條、或服務沒有啟用語意臂時不設。
  // 命中的順序是兩臂名次倒數融合的結果，不是任何一個分數。
  optional float semantic_similarity = 7;

  // 這一條的全文含有多少比例的查詢詞（0 至 1）：字面臂實際查的詞（已略過高頻詞、去重）有幾個也出現在條文裡。
  // 只命中查詢一小部分的條文覆蓋率低；與命中是哪一臂帶出的無關，語意臂帶出的條文也有。
  // 不影響名次與 `lexical_score`；呼叫端想排除「只沾到一個詞」的字面命中時拿它當條件。
  float term_coverage = 8;

  // 有幾件函釋提到查詢詞並解釋這一條；只有請求 `include_guidance` 時才會大於 0。不影響 `lexical_score`。
  int32 guidance_documents = 9;

  // 精排模型對（查詢，這一條）給的相關機率（0 至 1），只有請求 `rerank` 且精排成功時才設。分數與查詢無關地可比較
  // （已過 sigmoid），所以能拿來跟固定的門檻比；但門檻是受模型制約的值，要在黃金題庫上量測才能訂。
  // 設了之後，命中的順序就是依它由高到低（同分依精排前的名次）；沒有精排時次序是兩臂融合的結果。
  optional float rerank_score = 10;
}

message ListInvalidationsRequest {
  LawIdentifier identifier = 1;

  // 見 GetLawRequest.as_of。失效依這一天解析：失效日在這一天之後的裁判不列入；
  // 裁判之後修正的新文字不受影響，所以只列裁判作成時已在施行、且 `as_of` 當日仍是該文字的單元。
  string as_of = 2;

  // 只看某一條（條號依原文書寫，例如 "5-1"）；留空為整部法規。
  string article_number = 3;
}

message ListInvalidationsResponse {
  repeated Invalidation invalidations = 1;
}

message Invalidation {
  // 裁判字號，例如 "釋字第748號"、"111年憲判字第1號"。
  string ruling_no = 1;

  RulingKind ruling_kind = 2;

  // 公布或宣判日（ISO 8601）。
  string decided_on = 3;

  // 憲法法庭網站上該裁判的位址；使用時須標示出處（憲法法庭）。
  string source_url = 4;

  // 解釋文（判決主文）中宣告失效的原文，供核對失效日。
  string excerpt = 5;

  // 失效的條文單元路徑，例如 "art_7/para_1"；條號是 "art_" 後的部分。
  string path = 6;

  // 失效日（ISO 8601）。
  string invalid_from = 7;

  // 裁判只宣告條文的一部分（「關於…部分」「於此範圍內」）。失效仍記在整個條文單元上
  // （資料到項為止），範圍以 `excerpt` 核對；呼叫端不要據此斷定整條都不能適用。
  bool partial = 8;
}

enum RulingKind {
  RULING_KIND_UNSPECIFIED = 0;
  RULING_KIND_INTERPRETATION = 1;
  RULING_KIND_JUDGMENT = 2;
}

message ListLawsRequest {
  // 依哪一天施行的版本解析（ISO 8601）。留空為現行。
  string as_of = 1;

  // 可選管轄過濾；留空為全部管轄。
  string jurisdiction = 2;

  // 可選全國法規分類字首（單一大寫字母，例如 "O" 環境保護）；留空為全分類。
  string category_prefix = 3;
}

message LawSummary {
  LawIdentifier identifier = 1;
  string iri = 2;
  string title = 3;
  // 位階種類（corpus.norm_kind），例如 "constitution"、"statute"、"regulation"。
  string norm_kind = 4;
  // 制定日（ISO 8601）；語料沒有制定紀錄時為空。
  string date_document = 5;
  // 若為授權命令且已解析到授權母法，填母法的複合自然鍵；否則不設。
  LawIdentifier parent_identifier = 6;
  // 《中央法規標準法》定名種類（corpus.legal_resource.document_type），例如「法」「條例」「細則」「辦法」「標準」。
  string document_type = 7;
  // 於 `as_of` 當日有效之下位授權法規總數。
  int32 child_count = 8;
  // 已解析之上位授權母法總數（反映多母法共同授權）。
  int32 parent_count = 9;
  // 解釋本法條文且於 `as_of` 當日有效之函釋件數。
  int32 guidance_count = 10;
}

message ListLawsResponse {
  repeated LawSummary laws = 1;
}

message GetLawGraphRequest {
  // 焦點法規；留空代表「核心母法星系總覽」，依下位授權數選出代表母法並附憲法與多層關聯。
  LawIdentifier identifier = 1;

  // 見 GetLawRequest.as_of。
  string as_of = 2;

  // 總覽模式的可選分類字首（單一大寫字母，例如 "O" 環境保護）；留空為全部類別。
  string category_prefix = 3;

  // 向上追溯授權母法鏈之最大深度（0 表示預設 2；有效範圍 1 至 4）。
  int32 upstream_depth = 4;

  // 向下展開授權子法規之最大深度（0 表示預設 2；有效範圍 1 至 4）。
  int32 downstream_depth = 5;

  // 單一母法節點最多展開之直接子法規數（0 表示預設 20；有效範圍 1 至 60）。
  int32 child_limit = 6;

  // 若指定，僅展開該 `document_type` 之下位授權法規（例如「辦法」「標準」「細則」）。
  string child_document_type = 7;
}

message GetLawGraphResponse {
  // 焦點法規識別碼；總覽模式為未設定。
  LawIdentifier focus_identifier = 1;
  repeated LawGraphNode nodes = 2;
  repeated LawGraphEdge edges = 3;
  // 焦點法規內部之罰則與義務條文（或授權辦法條文）連動清單。
  repeated ArticleViolationLink violation_links = 4;
  // 解釋焦點法規條文且於 `as_of` 當日尚未停止適用之行政函釋摘要。
  repeated GuidanceLink guidance_links = 5;
  // 焦點法規所有有效直接子法規依 `document_type` 統計之分組數量，供漸進展開與聚合膠囊使用。
  repeated ChildGroupCount child_groups = 6;
}

message LawGraphNode {
  LawIdentifier identifier = 1;
  string iri = 2;
  string title = 3;
  string norm_kind = 4;
  string document_type = 5;
  string date_document = 6;
  // 凱爾森位階層級（0 憲法、1 法律、2 第一層法規命令、3 再授權子規則）。
  int32 hierarchy_tier = 7;
  // 於 `as_of` 當日有效之直接下位授權法規總數。
  int32 total_children = 8;
  // 本次回應中未展開之直接下位法規數量（> 0 時前端顯示聚合膠囊節點）。
  int32 truncated_children = 9;
  int32 article_count = 10;
  // 於 `as_of` 當日有效宣告違憲失效之單元數（須標示憲法法庭出處）。
  int32 invalidation_count = 11;
  int32 guidance_count = 12;
}

enum GraphEdgeKind {
  GRAPH_EDGE_KIND_UNSPECIFIED = 0;
  // 法律直接授權訂定法規命令。
  GRAPH_EDGE_KIND_DELEGATION = 1;
  // 授權命令進一步授權訂定之下位規則。
  GRAPH_EDGE_KIND_SUB_DELEGATION = 2;
}

message LawGraphEdge {
  LawIdentifier source = 1;
  LawIdentifier target = 2;
  GraphEdgeKind kind = 3;
  // 母法授權依據條項路徑或格式條號清單（例如「第 38 條」「第 42 條第 2 項」）。
  repeated string anchor_articles = 4;
  bool all_rooted = 5;
}

enum ViolationReferenceKind {
  VIOLATION_REFERENCE_KIND_UNSPECIFIED = 0;
  // 罰則直接處罰所引用義務條文之違反。
  VIOLATION_REFERENCE_KIND_DUTY = 1;
  // 罰則處罰「違反依母法第 N 條所定辦法」。
  VIOLATION_REFERENCE_KIND_DELEGATED_RULE = 2;
}

message ArticleViolationLink {
  string penalty_article = 1;
  string penalty_path = 2;
  ViolationReferenceKind kind = 3;
  string target_article = 4;
  string target_path = 5;
}

message GuidanceLink {
  string article_number = 1;
  string path = 2;
  string document_no = 3;
  string issuer = 4;
  string issued_on = 5;
  string subject = 6;
  string source_url = 7;
}

message ChildGroupCount {
  string document_type = 1;
  int32 count = 2;
}

message GetArticleByIriRequest {
  // 條文版本的標準 IRI（例如 https://envcite/tw/law/O0020001/2023-11-29/zho/art_11）。
  string iri = 1;
}

message ArticleDetail {
  string iri = 1;
  LawIdentifier identifier = 2;
  string law_title = 3;
  string number = 4;
  string content = 5;
  string language = 6;
  string date_document = 7;
  string norm_kind = 8;
}

message GetArticleByIriResponse {
  ArticleDetail article = 1;
}

