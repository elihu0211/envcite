syntax = "proto3";

package envcite.ontology.v2;

option csharp_namespace = "EnvCite.Ontology.V2";

// 環境法規本體的唯讀存取（關聯式，PostgreSQL）。
//
// 內部服務，認證由叢集的服務網格負責。
// 選填 metadata：`x-tenant-id`、`x-request-id`，只用於日誌與稽核；資料不分租戶。
service OntologyService {
  // 依自然鍵複合標識取得一部法規；不存在回 NOT_FOUND。
  rpc GetLaw(GetLawRequest) returns (GetLawResponse);

  // 依閱讀順序列出一部法規的條文；法規不存在回 NOT_FOUND。
  rpc ListArticles(ListArticlesRequest) returns (ListArticlesResponse);

  // 在 `as_of` 當日有效的條文上做混合檢索，相關度由高到低。查詢是原始文字，
  // 由服務以建索引時的斷詞器自行斷詞：呼叫端若自行斷詞，會悄悄比對到較少的列。
  rpc SearchArticles(SearchArticlesRequest) returns (SearchArticlesResponse);

  // `as_of` 當日因大法官解釋或憲法法庭判決而失效的條文單元（違憲失效）。法規不存在或
  // 該日無施行版本的回應同 GetLaw。
  rpc ListInvalidations(ListInvalidationsRequest) returns (ListInvalidationsResponse);
}

// 法規的複合自然鍵（管轄，識別碼方案，在地識別碼）。三個欄位都必填，沒有預設：
// 缺少任一個回 INVALID_ARGUMENT（`EMPTY`），值不在下列集合內也是 INVALID_ARGUMENT（`UNKNOWN_VALUE`）。
message LawIdentifier {
  // 管轄代號：'TW-CENTRAL'（中央）或 ISO 3166-2:TW 的 22 個縣市代碼（'TW-TPE'、'TW-NWT'、
  // 'TW-TAO'、'TW-TXG'、'TW-TNN'、'TW-KHH'、'TW-KEE'、'TW-HSZ'、'TW-CYI'、'TW-HSQ'、'TW-MIA'、
  // 'TW-CHA'、'TW-NAN'、'TW-YUN'、'TW-CYQ'、'TW-PIF'、'TW-ILA'、'TW-HUA'、'TW-TTT'、'TW-PEN'、
  // 'TW-KIN'、'TW-LIE'）。縣市管轄是契約預留，目前沒有取得來源。
  string jurisdiction = 1;

  // 方案代號：'moj_pcode'（全國法規資料庫 pcode，只配 'TW-CENTRAL'）或 'local_glrs'（地方法規，
  // 只配縣市；契約預留，目前沒有取得來源）。不合法的配對不存在於語料，查詢回 NOT_FOUND。
  string id_scheme = 2;

  // 在地識別碼，在（管轄，方案）之內唯一。
  string local_id = 3;
}

message Law {
  // 複合自然鍵識別碼。
  LawIdentifier identifier = 1;

  // 法規的標準 IRI。
  string iri = 2;

  // `as_of` 所解析版本的標題。標題屬於公布的版本而非法規本身：修正可能改名。
  string title = 3;

  // 標題的 ISO 639-3 語言代碼，例如 "zho"（IRI 中也用同一代碼）。
  string language = 4;

  // 制定日（ISO 8601）；語料沒有制定紀錄時為空。
  string date_document = 5;

  // 曾有核定機關、核定文號、核定日、失效依據與失效日欄位，語料沒有任何來源填它們而移除；
  // 違憲失效以 ListInvalidations 取得。
  reserved 6 to 10;
  reserved "approval_authority", "approval_doc_no", "ratified_at", "invalidated_by",
      "invalidation_date";
}

message Article {
  string iri = 1;

  // 條號，依原文書寫，例如 "1"、"5-1"（第 5 條之 1）。
  string number = 2;
}

message GetLawRequest {
  LawIdentifier identifier = 1;

  // 依哪一天施行的版本解析（ISO 8601）。留空為現行。語料沒有版本涵蓋該日時
  // 回 NOT_FOUND，絕不回現行文字：那會與正確答案無從分辨。
  string as_of = 2;
}

message GetLawResponse {
  Law law = 1;
}

message ListArticlesRequest {
  LawIdentifier identifier = 1;

  // 見 GetLawRequest.as_of。
  string as_of = 2;
}

message ListArticlesResponse {
  repeated Article articles = 1;
}

message SearchArticlesRequest {
  // 查詢原文，不要自行斷詞或改寫。
  string query = 1;

  // 見 GetLawRequest.as_of。
  string as_of = 2;

  // 最多回傳幾筆；0 為服務預設值。
  int32 limit = 3;

  // 可選管轄過濾：留空為全部管轄；有值須是 LawIdentifier.jurisdiction 的合法值，否則 INVALID_ARGUMENT。
  string jurisdiction = 4;

  // 把函釋提到查詢詞的條文也納入：查詢以空白分成詞組（最多 5 個，每個 2 至 30 字），主旨或內文含每個詞組、
  // 在 `as_of` 有效的函釋，所解釋的條文（`guidance_documents` > 0）與兩臂的結果以名次倒數融合，
  // 最多比 `limit` 多回 5 條。詞組出現在太多函釋裡時（命中的函釋占可用函釋的比例超過服務的設定）指不出哪幾條，
  // 這個查詢不納入函釋。函釋只用來找條文，不是推論的前提；預設不納入，不影響其他呼叫端的結果。
  bool include_guidance = 5;
}

message SearchArticlesResponse {
  // 相關度由高到低：字面臂與語意臂以名次倒數融合。
  repeated ArticleHit hits = 1;
}

message ArticleHit {
  string iri = 1;
  LawIdentifier identifier = 2;

  // `as_of` 當日有效版本的法規標題。
  string law_title = 3;

  // 條號，依原文書寫，例如 "5-1"。
  string number = 4;

  string content = 5;

  // 字面臂的原始分數（ts_rank_cd）；字面臂沒有命中這一條時為 0。只在同一次查詢之內可比較。
  float lexical_score = 6;

  // 語意臂的餘弦相似度（-1 至 1）；語意臂沒有命中這一條、或服務沒有啟用語意臂時不設。
  // 命中的順序是兩臂名次倒數融合的結果，不是任何一個分數。
  optional float semantic_similarity = 7;

  // 這一條的全文含有多少比例的查詢詞（0 至 1）：字面臂實際查的詞（已略過高頻詞、去重）有幾個也出現在條文裡。
  // 只命中查詢一小部分的條文覆蓋率低；與命中是哪一臂帶出的無關，語意臂帶出的條文也有。
  // 不影響名次與 `lexical_score`；呼叫端想排除「只沾到一個詞」的字面命中時拿它當條件。
  float term_coverage = 8;

  // 有幾件函釋提到查詢詞並解釋這一條；只有請求 `include_guidance` 時才會大於 0。不影響 `lexical_score`。
  int32 guidance_documents = 9;
}

message ListInvalidationsRequest {
  LawIdentifier identifier = 1;

  // 見 GetLawRequest.as_of。失效依這一天解析：失效日在這一天之後的裁判不列入；
  // 裁判之後修正的新文字不受影響，所以只列裁判作成時已在施行、且 `as_of` 當日仍是該文字的單元。
  string as_of = 2;

  // 只看某一條（條號依原文書寫，例如 "5-1"）；留空為整部法規。
  string article_number = 3;
}

message ListInvalidationsResponse {
  repeated Invalidation invalidations = 1;
}

message Invalidation {
  // 裁判字號，例如 "釋字第748號"、"111年憲判字第1號"。
  string ruling_no = 1;

  RulingKind ruling_kind = 2;

  // 公布或宣判日（ISO 8601）。
  string decided_on = 3;

  // 憲法法庭網站上該裁判的位址；使用時須標示出處（憲法法庭）。
  string source_url = 4;

  // 解釋文（判決主文）中宣告失效的原文，供核對失效日。
  string excerpt = 5;

  // 失效的條文單元路徑，例如 "art_7/para_1"；條號是 "art_" 後的部分。
  string path = 6;

  // 失效日（ISO 8601）。
  string invalid_from = 7;

  // 裁判只宣告條文的一部分（「關於…部分」「於此範圍內」）。失效仍記在整個條文單元上
  // （資料到項為止），範圍以 `excerpt` 核對；呼叫端不要據此斷定整條都不能適用。
  bool partial = 8;
}

enum RulingKind {
  RULING_KIND_UNSPECIFIED = 0;
  RULING_KIND_INTERPRETATION = 1;
  RULING_KIND_JUDGMENT = 2;
}
