syntax = "proto3";

package envcite.ontology.v1;

option csharp_namespace = "EnvCite.Ontology.V1";

// Read access to the normative annotations of the ontology and the candidate
// conclusions drawn from them.
//
// Same transport rules as OntologyService (see proto/README.md): internal service,
// optional `x-tenant-id` / `x-request-id` for logging only. Errors carry a
// google.rpc.ErrorInfo (reason in UPPER_SNAKE_CASE, domain "ontology.envcite") and, for INVALID_ARGUMENT, a google.rpc.BadRequest.
//
// Every conclusion here is a CANDIDATE. Nothing is concluded from a statement that
// has not been confirmed by the verification gates; with no confirmed annotations
// every verdict list is empty. The service never decides what a court or an
// authority would decide: it reports what follows from the confirmed statements,
// what is missing, and what needs a human judgement.
service ReasoningService {
  // The confirmed statements (with the requirements, exceptions and sanctions
  // attached to them) of one law, as in force on `as_of`. NOT_FOUND when the law is
  // unknown (LAW_NOT_FOUND) or no version covers the date (AS_OF_NOT_COVERED).
  rpc ListStatements(ListStatementsRequest) returns (ListStatementsResponse);
  // Evaluates a case against the statements in force. Unary, read-only, safe to
  // retry. The deadline is a budget: the evaluation is bounded by it, and a call
  // that cannot get a slot within it fails with RESOURCE_EXHAUSTED (BUSY).
  rpc Evaluate(EvaluateRequest) returns (EvaluateResponse);
}

// A decimal number as text ("100", "0.5"), never a float: thresholds are
// numeric(18,3) in the corpus and a double would not round-trip them.
message Decimal {
  string value = 1;
}

enum StatementKind {
  STATEMENT_KIND_UNSPECIFIED = 0;
  // Prescribes conduct: has a NormModality.
  STATEMENT_KIND_PRESCRIPTIVE = 1;
  // Defines, delimits scope, or delegates (a "得" that authorises an authority is
  // constitutive, not a permission).
  STATEMENT_KIND_CONSTITUTIVE = 2;
  STATEMENT_KIND_PENALTY = 3;
  STATEMENT_KIND_REPARATION = 4;
}

enum NormModality {
  NORM_MODALITY_UNSPECIFIED = 0;
  NORM_MODALITY_OBLIGATION = 1;
  NORM_MODALITY_PROHIBITION = 2;
  NORM_MODALITY_PERMISSION = 3;
}

enum SlotRole {
  SLOT_ROLE_UNSPECIFIED = 0;
  SLOT_ROLE_SUBJECT = 1;
  SLOT_ROLE_ACTION = 2;
  SLOT_ROLE_OBJECT = 3;
  SLOT_ROLE_MEDIUM = 4;
  SLOT_ROLE_TIME = 5;
  SLOT_ROLE_PLACE = 6;
}

enum Comparator {
  COMPARATOR_UNSPECIFIED = 0;
  COMPARATOR_LE = 1;
  COMPARATOR_LT = 2;
  COMPARATOR_GE = 3;
  COMPARATOR_GT = 4;
  COMPARATOR_EQ = 5;
  COMPARATOR_NE = 6;
}

enum ConditionRole {
  CONDITION_ROLE_UNSPECIFIED = 0;
  // Whether the norm reaches the facts at all.
  CONDITION_ROLE_SCOPE = 1;
  // What compliance consists of.
  CONDITION_ROLE_DUTY = 2;
  // A limit value set by a delegated regulation.
  CONDITION_ROLE_LIMIT = 3;
}

// Kinds of legal consequence. FINE and CONFISCATION are administrative penalties
// under the first article of 行政罰法; RESTRICTION, DEPRIVATION, REPUTATION and
// WARNING are the four "other kinds" of its second article. ORDER (an improvement
// order and the like) is a preventive measure, NOT a penalty: the general part of
// 行政罰法 does not apply to it.
enum LegalEffect {
  LEGAL_EFFECT_UNSPECIFIED = 0;
  LEGAL_EFFECT_FINE = 1;
  LEGAL_EFFECT_CONFISCATION = 2;
  LEGAL_EFFECT_RESTRICTION = 3;
  LEGAL_EFFECT_DEPRIVATION = 4;
  LEGAL_EFFECT_REPUTATION = 5;
  LEGAL_EFFECT_WARNING = 6;
  LEGAL_EFFECT_ORDER = 7;
}

enum OverrideBasis {
  OVERRIDE_BASIS_UNSPECIFIED = 0;
  // 中央法規標準法 art. 11.
  OVERRIDE_BASIS_HIERARCHY = 1;
  // 中央法規標準法 art. 16.
  OVERRIDE_BASIS_LEX_SPECIALIS = 2;
  // Doctrine, not statute; used only when the annotation says so.
  OVERRIDE_BASIS_LEX_POSTERIOR = 3;
  OVERRIDE_BASIS_EXCEPTION = 4;
}

// ---- ListStatements ------------------------------------------------------------

message ListStatementsRequest {
  // 全國法規資料庫 pcode, e.g. "O0020001".
  string law_id = 1;
  // ISO 8601 date; empty means today. See GetLawRequest.as_of.
  string as_of = 2;
}

message ListStatementsResponse {
  repeated Statement statements = 1;
  repeated Override overrides = 2;
}

message Statement {
  // Identifier of the statement; meaningful within one corpus state, not a stable
  // key (a rejected and re-extracted statement gets a new one).
  int64 id = 1;
  StatementKind kind = 2;
  // Set exactly when kind is PRESCRIPTIVE.
  optional NormModality modality = 3;
  // IRI of the provision version the statement was read from.
  string version_iri = 4;
  repeated Slot slots = 5;
  // When the norm applies. No disjuncts means it always does.
  Requirement scope = 6;
  // What compliance consists of. No disjuncts means nothing beyond scope.
  Requirement duty = 7;
  // Limit values this statement sets (a statement that is a delegated limit).
  repeated Condition limits = 8;
  // Statements this one is an exception (a proviso) to.
  repeated int64 exception_of = 9;
  optional Sanction sanction = 10;
}

message Slot {
  SlotRole role = 1;
  oneof value {
    // Code of a controlled concept.
    string concept = 2;
    string literal = 3;
  }
}

// Disjunctive normal form: an OR over disjuncts, each an AND over its conditions.
message Requirement {
  repeated Disjunct any_of = 1;
}

message Disjunct {
  repeated Condition all_of = 1;
}

message Condition {
  int64 id = 1;
  // Code of the controlled concept the condition is about.
  string concept = 2;
  Comparator comparator = 3;
  oneof threshold {
    Decimal value = 4;
    // The threshold is set by another provision, resolved on the day asked.
    Delegation delegate = 5;
    // Compared with a concept, not a number.
    string value_concept = 6;
  }
  string unit = 7;
  bool negated = 8;
  // An indeterminate legal concept ("情節重大", "必要時"): the service does not
  // decide it from facts. A caller-supplied value counts as the caller's judgement.
  bool needs_assessment = 9;
}

message Delegation {
  // 全國法規資料庫 pcode of the delegated law.
  string law_id = 1;
  // Path of the delegated provision, e.g. "art_2".
  string provision_path = 2;
}

message Sanction {
  // The statement this sanction punishes (or, for ORDER, enforces).
  int64 punishes = 1;
  LegalEffect effect = 2;
  optional int64 min_amount = 3;
  optional int64 max_amount = 4;
  string amount_text = 5;
  // Repeated imposition for continued non-compliance (按次處罰).
  bool per_occasion = 6;
  // The text says "得" (the authority may), not "應" (shall): an effect-level
  // discretion, distinct from Condition.needs_assessment.
  bool discretionary = 7;
}

message Override {
  int64 prevailing = 1;
  int64 subordinate = 2;
  OverrideBasis basis = 3;
}

// ---- Evaluate ------------------------------------------------------------------

message EvaluateRequest {
  // ISO 8601 date of the conduct. Required.
  string conduct_on = 1;
  // ISO 8601 date the disposition is made. Required; not before conduct_on.
  string decided_on = 2;
  // Facts about the case, by concept code. A concept may carry several values; a
  // contradiction is reported, not resolved. Codes beginning "ap_" are reserved for
  // administrative_penalty_facts.
  repeated Fact facts = 3;
  AdministrativePenaltyFacts administrative_penalty_facts = 4;
  // ISO 8601 date the conduct ended; starts the three-year limitation period of
  // 行政罰法 art. 27. Without it the period is not applied.
  string conduct_ended_on = 5;
  // ISO 8601 date the result occurred, when later than the conduct's end.
  string result_on = 6;
}

message Fact {
  string concept = 1;
  repeated FactValue values = 2;
}

message FactValue {
  oneof value {
    bool flag = 1;
    Decimal number = 2;
  }
}

// Facts the general part of 行政罰法 turns on. Absent means unknown, which is not
// the same as false: the text applies some rules only on a known false and others
// only on a known true.
message AdministrativePenaltyFacts {
  optional bool intent = 1;
  optional bool negligence = 2;
  optional bool agent_fault = 3;
  optional int32 age = 4;
  optional bool incapable = 5;
  optional bool self_induced = 6;
  optional bool pursuant_to_law = 7;
  optional bool superior_order = 8;
  optional bool knew_illegal = 9;
  optional bool stated_opinion = 10;
  optional bool self_defense = 11;
  optional bool defense_excessive = 12;
  optional bool necessity = 13;
  optional bool necessity_excessive = 14;
  optional bool capacity_reduced = 15;
  optional bool ignorance_of_law = 16;
}

message EvaluateResponse {
  // The law at the time of the disposition (行政罰法 art. 5: the default).
  Outcome at_decision = 1;
  // Laws in force between the conduct and the disposition whose statements differ
  // from those at_decision, earliest first. The one "most favourable" under art. 5
  // is not chosen here: the sets cannot be ranked mechanically.
  repeated EarlierLaw earlier = 2;
}

message EarlierLaw {
  // First day this set of statements applied (ISO 8601).
  string first_day = 1;
  Outcome outcome = 2;
}

message StatementSource {
  int64 statement_id = 1;
  // IRI of the provision version the statement was read from.
  string version_iri = 2;
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_VIOLATION = 1;
  VERDICT_COMPLIANT = 2;
  // Holds only if an exception that is not decided does not apply.
  VERDICT_CONDITIONAL_VIOLATION = 3;
  VERDICT_CONDITIONAL_COMPLIANT = 4;
  // Cannot be decided from the facts given: see missing and needs_assessment.
  VERDICT_UNDETERMINED = 5;
  // Excluded by a proviso that holds.
  VERDICT_EXCLUDED = 6;
  VERDICT_NOT_APPLICABLE = 7;
}

message Outcome {
  repeated StatementVerdict verdicts = 1;
  repeated PenaltyCandidate penalties = 2;
  // If the fines are one act (行政罰法 art. 24), the single interval they merge
  // into. The several-acts reading (art. 25) is each penalty's own amounts. Neither
  // is chosen.
  optional FineInterval one_act = 3;
  // Facts the verdicts need and the case does not give.
  repeated Gap missing = 4;
  // Indeterminate concepts the caller has to judge.
  repeated Gap needs_assessment = 5;
  // Judgements the caller supplied that a conclusion rests on.
  repeated Gap assessment_used = 6;
  repeated Problem problems = 7;
  repeated StatementPair unresolved_conflicts = 8;
  repeated Defeat defeated = 9;
  repeated StatementPair unresolved_penalty_overlaps = 10;
  repeated Defeat penalty_defeated = 11;
  repeated TraceEntry trace = 12;
  // Condition id to the statement that supplied its delegated limit.
  map<int64, int64> limit_sources = 13;
  GeneralPart general = 14;
  // Where each statement mentioned in this outcome was read from.
  repeated StatementSource sources = 15;
  // Laws (pcode) that were already enacted on the day this outcome concerns but of
  // which the corpus holds no version from that day: it has only the current
  // consolidated text and what the history says, not earlier texts. Their rules are
  // missing from this outcome, which is NOT the same as the law having had no such
  // rule. Empty for a day the corpus covers.
  repeated string uncovered_law_ids = 16;
}

message StatementVerdict {
  int64 statement_id = 1;
  Verdict verdict = 2;
}

message PenaltyCandidate {
  int64 statement_id = 1;
  int64 punishes = 2;
  LegalEffect effect = 3;
  optional int64 min_amount = 4;
  optional int64 max_amount = 5;
  // The penalty's own requirements, or the punished statement's verdict, are not
  // yet decided.
  bool conditional = 6;
  bool per_occasion = 7;
  bool discretionary = 8;
}

message FineInterval {
  int64 min_amount = 1;
  int64 max_amount = 2;
}

// A concept a statement needs.
message Gap {
  int64 statement_id = 1;
  string concept = 2;
}

enum ProblemKind {
  PROBLEM_KIND_UNSPECIFIED = 0;
  // Two different values for one concept: the concept is treated as unknown.
  PROBLEM_KIND_CONTRADICTORY_FACT = 1;
  // A delegated limit that could not be resolved on the day.
  PROBLEM_KIND_UNRESOLVED_DELEGATION = 2;
  // A requirement the evaluation does not compare.
  PROBLEM_KIND_UNSUPPORTED_CONDITION = 3;
  PROBLEM_KIND_BAD_DATE = 4;
}

message Problem {
  ProblemKind kind = 1;
  oneof subject {
    string concept = 2;
    int64 condition_id = 3;
  }
}

message StatementPair {
  int64 first = 1;
  int64 second = 2;
}

message Defeat {
  int64 loser = 1;
  int64 winner = 2;
  OverrideBasis basis = 3;
}

message TraceEntry {
  int64 condition_id = 1;
  int64 statement_id = 2;
  string concept = 3;
  Decimal fact = 4;
  Decimal threshold = 5;
  ConditionRole role = 6;
}

enum Excuse {
  EXCUSE_UNSPECIFIED = 0;
  EXCUSE_NO_FAULT = 1;
  EXCUSE_UNDER_FOURTEEN = 2;
  EXCUSE_INCAPABLE = 3;
  EXCUSE_PURSUANT_TO_LAW = 4;
  EXCUSE_SUPERIOR_ORDER = 5;
  EXCUSE_SELF_DEFENSE = 6;
  EXCUSE_NECESSITY = 7;
}

enum Mitigation {
  MITIGATION_UNSPECIFIED = 0;
  MITIGATION_YOUTH = 1;
  MITIGATION_REDUCED_CAPACITY = 2;
  MITIGATION_IGNORANCE = 3;
  MITIGATION_EXCESSIVE_DEFENSE = 4;
  MITIGATION_EXCESSIVE_NECESSITY = 5;
}

// The general part of 行政罰法 on the penalties of an outcome. A penalty that is not
// punishable on the facts given is absent from `penalties` and appears here.
message GeneralPart {
  repeated PenaltyExcuse unpunished = 1;
  repeated PenaltyMitigation mitigation = 2;
  // Penalties presumed on the agent's fault.
  repeated int64 presumed_agent_fault = 3;
  // Penalties listed whose three-year limitation period (art. 27) has run by
  // decided_on. The penalty stays a candidate; applying the bar is the caller's.
  repeated int64 time_barred = 4;
}

message PenaltyExcuse {
  int64 penalty_statement_id = 1;
  Excuse excuse = 2;
}

message PenaltyMitigation {
  int64 penalty_statement_id = 1;
  Mitigation mitigation = 2;
}
