[project]
name = "envcite-grpc"
version = "0.1.0"
description = "gRPC plumbing shared by envcite services"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "grpcio",
    "grpcio-health-checking",
    "opentelemetry-api",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-instrumentation-grpc",
    "opentelemetry-sdk",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
