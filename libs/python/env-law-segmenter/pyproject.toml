[project]
name = "env-law-segmenter"
version = "0.1.0"
description = "Chinese segmentation for env-law, with a lexicon derived from the corpus"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["jieba>=0.42.1"]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Full-width punctuation is flagged as ambiguous by RUF001 (strings), RUF002
# (docstrings) and RUF003 (comments). All three are off here, and only here.
#
# Elsewhere in the repo only RUF001 is off, because only the fixtures are
# Chinese while the prose around them is English. This library's subject *is*
# Chinese statutory terms: the limitation on 「廢（污）水處理設施」 cannot be
# explained without writing it, and the extraction patterns 「本法所稱X，指…」
# are the criterion itself. Quoting a term is not writing a comment in Chinese.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# jieba ships no type information.
module = "jieba.*"
ignore_missing_imports = true

[tool.pytest]
minversion = "9.0"
addopts = ["-ra"]
testpaths = ["tests"]
strict = true
