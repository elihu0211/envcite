# Python 的 uv workspace。依賴版本由這裡的 uv.lock 統一解析：每個套件在整個倉庫只有一個
# 版本，成員的 pyproject 只列名稱。開發工具與 ruff／mypy／pytest 設定也只寫在這裡。
# 部署邊界不變：各服務的映像只裝自己的成員（`uv sync --package`）。

[tool.uv.workspace]
members = ["services/ontology", "libs/python/*"]

[tool.uv]
# 已知與現行程式碼不相容的上界；`uv lock --upgrade`（Renovate 的 lock file maintenance）不看
# Renovate 的規則，只看這裡。
# - ruff<0.17：0.17 把 tomllib 歸到標準庫區塊，services/ontology 的
#   verification/config.py 出現 I001（import 排序），新舊版對該檔的排序互相矛盾，無法預先修在 main。
#   升 ruff 的同一個 pull request 以 `ruff check --fix` 一併改，再放寬此上界。
constraint-dependencies = [
    "ruff<0.17",
]

[dependency-groups]
dev = [
    "grpcio-tools",
    "mypy",
    "mypy-protobuf",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pyyaml",
    "ranx",
    "ruff",
    "testcontainers[postgres]",
    "types-grpcio",
    "types-grpcio-health-checking",
    "types-grpcio-reflection",
    "types-grpcio-status",
    "types-lxml",
    "types-protobuf",
    "types-pyyaml",
]

[tool.ruff]
line-length = 100
# 工作區根沒有 [project]，ruff 推不出版本；各成員都要求 >=3.14，在這裡明說，UP 規則才會要求新語法。
target-version = "py314"
# 第一方套件的位置，import 排序據此區分第一方與第三方
src = ["services/*/src", "services/*", "libs/python/*/src", "libs/python/*"]
extend-exclude = ["libs/python/envcite-proto/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C901", "PLR0912", "PLR0915",
          "D100", "D101", "D102", "D103", "ANN401"]
# RUF001／RUF002／RUF003 把全形標點當成易混淆字元；法條與註解都是中文，全形標點是對的。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.ruff.lint.pylint]
max-branches = 14
max-statements = 60

[tool.ruff.lint.per-file-ignores]
# 公開符號要有 docstring（D1）、不用 `Any` 標註（ANN401）：只守 services/ontology 的 src，
# 其餘（測試、評估腳本、其他函式庫、ci）不套。
"**/tests/**" = ["D1", "ANN401"]
"libs/**" = ["D1", "ANN401"]
"ci/**" = ["D1", "ANN401"]
# 評估腳本是一次性的量測工具，不在服務的執行路徑上。
"services/ontology/tools/**" = ["C901", "PLR0912", "PLR0915", "D1", "ANN401"]
# 動態邊界：clingo 的答案集原子，各述詞的引數型別由 rules.lp 決定（見 `_py` 的說明）。
"services/ontology/src/envcite_ontology/reasoning/engine.py" = ["ANN401"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# grpc_tools 產生的程式碼；型別由一併提交的 .pyi 提供。
module = ["envcite.consult.v2.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# ranx（評估工具用）不帶型別資訊，也沒有 types- 套件。
module = "ranx"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# googleapis-common-protos（google.rpc 的 ErrorInfo、BadRequest）不帶型別資訊，也沒有 types- 套件。
module = "google.rpc.*"
ignore_missing_imports = true

[tool.coverage.run]
# 在成員目錄執行，CI 以 COVERAGE_RCFILE 指向本檔。
source = ["src"]
branch = true

[tool.pytest]
# 測試逐成員執行（在成員目錄下 `uv run pytest`）：各成員的 tests 同名，不合併成一個 session。
minversion = "9.0"
addopts = ["-ra"]
strict = true
