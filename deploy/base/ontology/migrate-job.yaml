# Schema migration as its own task, not as server startup.
#
# A server that migrates on boot makes every replica a writer and turns a rollout
# into a race. As a Job it has a beginning and an end that a rollout can wait on,
# and a failure is visible as a failed Job rather than as a crash-looping replica.
#
# 🚨 ttlSecondsAfterFinished is not optional. A finished Job without it keeps its
# pod, and the pod keeps its image pinned on the node; enough of them and the node
# fills up. This has actually happened in a sibling system (2026-08-28).
#
# Under Argo CD it is a Sync hook in wave 1: after the database (wave 0, whose
# Cluster and Database health Argo CD checks natively) and before the Deployment
# (wave 2). Not PreSync — on the first sync that would run before the database
# exists. BeforeHookCreation deletes the previous run at the next sync, which is
# what lets a Job (immutable pod template) be re-run with a new image at all.
apiVersion: batch/v1
kind: Job
metadata:
  name: env-law-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  # Migrations are minutes at most. A hung one means the database is unreachable,
  # and waiting longer does not improve that.
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: env-law-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: env-law-ontology
          command: ["env-law-migrate"]
          env:
            # Directly to the rw service, deliberately not through the pooler.
            # Migrations run DDL in one long-lived connection; transaction pooling
            # gives no guarantee that consecutive statements reach the same backend.
            - name: ONTOLOGY_DSN
              valueFrom:
                secretKeyRef:
                  name: env-law-pg-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
