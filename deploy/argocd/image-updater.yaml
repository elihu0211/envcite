# 新映像自動上線：Argo CD Image Updater 監看 registry，env-law 的 main 推出新映像
# （tag 為 commit SHA）後，就把 Application 改到那顆映像，由 Argo CD 同步。
#
# write-back 用 `argocd`：直接改 Application，不寫回 git——CI 不需要回寫，也不需要
# 任何能寫倉庫的 token。代價是線上跑的 tag 記在 Application 上而非 base/；
# base/kustomization.yaml 的 tag 是首次部署與回退用的基準。
#
# 與 env-law.yaml 相同：一次性 `kubectl apply -n argocd`。
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: env-law
  namespace: argocd
spec:
  # Application 所在的 namespace（env-law.yaml 裝在 argocd）。
  namespace: argocd
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: env-law
      images:
        - alias: ontology
          imageName: registry.gitlab.com/thuaisse-lab/env-law/ontology
          commonUpdateSettings:
            # tag 只有 commit SHA，沒有版本序，故依建置時間取最新。
            updateStrategy: newest-build
            allowTags: "regexp:^[0-9a-f]{40}$"
            # registry 是私有的。Secret 放在 Image Updater 所在的 argocd namespace，
            # 內容與 env-law namespace 的 env-law-registry 相同（README「叢集端前提」）。
            pullSecret: pullsecret:argocd/env-law-registry
          manifestTargets:
            kustomize:
              # base/ 裡的映像名稱（由 base/kustomization.yaml 解析成 registry 路徑）。
              name: env-law-ontology
