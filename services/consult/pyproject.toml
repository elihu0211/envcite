[project]
name = "envcite-consult"
version = "0.1.0"
description = "envcite consultation service (grounding evidence for callers' own models, gRPC)"
readme = "README.md"
authors = [
    { name = "Eli Hu", email = "elihu@go.thu.edu.tw" }
]
requires-python = ">=3.14"
dependencies = [
    "envcite-grpc",
    "envcite-proto",
    "grpcio-health-checking",
]

[tool.uv.sources]
envcite-grpc = { workspace = true }
envcite-proto = { workspace = true }

[project.scripts]
envcite-consult = "envcite_consult.server:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
