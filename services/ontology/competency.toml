# 能力問題登記：本體必須回答的問題與各題今天的實作現況。這個檔與 tests/test_competency.py 是現況的單一真值。
#
# status
#   answerable  術語層（資料庫物件或 rpc）與機制都在，且有測試；不表示資料庫裡已有答案。
#   partial     只做了一部分：表在而機制只做一半，或依賴另一題而那一題沒有。
#   design_only 只有設計，沒有資料庫物件與 rpc 承載。
#
# evidence（逐項由 tests/test_competency.py 驗證確實存在）
#   db     "schema.object"：套完遷移的真實 PostgreSQL 裡的表、檢視或函式
#   rpc    "Service.Method"：proto 裡的 rpc
#   field  "Message.field"：proto 訊息的欄位
#   test   "tests/檔名.py::函式"：該測試函式

