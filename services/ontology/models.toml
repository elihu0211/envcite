# 端點、金鑰名稱、角色與嵌入模型只寫在這一個檔。金鑰本體不寫進來。
#
# family 由人宣告，獨立性規則依它判定：驗證者不得與抽取者同一家族，評審團至少要兩個不同家族。

# 一個 OpenAI 相容的端點。金鑰名由端點名推導（這裡是 ENVCITE_LLM_API_KEY）：依序取同名環境變數、
# 作業系統鑰匙圈同名 service（見 CONFIGURATION.md），所以各環境寫法相同。同時服務對話與嵌入。
[endpoint.llm]
base_url = "https://api.ithu.tw/v1"

# name 原樣送給端點。選用：max_tokens（回答長度上限）、max_retries（暫時性失敗的重試次數，0 為不重試）。
# 推理模型的思考計入輸出長度，max_tokens 要留足。
[model.mistral]
endpoint = "llm"
name = "mistral-small-4"
family = "mistral"

[model.muse]
endpoint = "llm"
name = "muse-spark-open"
family = "meta"

[model.nemotron]
endpoint = "llm"
name = "nemotron-3.5-super-vl"
family = "nvidia"
max_tokens = 16384

# 黃金測試集的相關性判定者之一（tools/relevance_judge.py），不參與任何管線。家族依端點的路由表
# （/v1/model/info）宣告：ornith-35b 是以 Qwen 3.5 為底的 Ornith 1.0。
# 端點上多個名稱指向同一個模型，名稱不同不代表家族不同，選模型要看路由表：
#   Mistral-Small-4：mistral-small-4、office、gpt-oss-120b
#   nemotron-3.5-super-vl：nemotron-3.5-super-vl、vibe、nemotron-3-ultra
#   Ornith-1.0-35B：ornith-35b、horizon、vibelight
#   muse-spark-open：muse-spark-open、coder、vibecode
# 漏看的別名由判定與管線開跑前的 SameModel 探測擋下。
[model.ornith]
endpoint = "llm"
name = "ornith-35b"
family = "qwen"
max_tokens = 4096

# 語意檢索臂的嵌入模型（envcite-ontology、envcite-sync 經 ENVCITE_ONTOLOGY_MODELS 讀這一段）。
# 沿用上面的端點；沒有這一段時只用字面臂。換維度不是 1024 的模型要配一支遷移。
[embedding]
endpoint = "llm"
name = "bge-m3-embedding"

# Anthropic 的模型不經端點，金鑰取自 ANTHROPIC_API_KEY（需要 `uv sync --extra llm`）。
# [model.claude]
# provider = "anthropic"
# name = "claude-sonnet-5-5"

# 四個角色都要指名：抽取者、往返驗證的重抽者、獨立測試的設計者、評審團。驗證者都與抽取者不同家族。
[roles]
extractor = "mistral"
roundtrip = "nemotron"
independent_test = "muse"
panel = ["muse", "nemotron"]

# 判定者不得與受測系統同家族。黃金測試集量的是檢索與作答，受測路徑上只有嵌入 bge-m3（baai）與
# consult 作答的 mistral-small-4（mistral）；標註管線的抽取與評審角色是離線的，不在受測路徑上，
# 所以它們的家族（nvidia、meta）可以當判定者。
[relevance]
judges = ["nemotron", "ornith"]
system_families = ["baai", "mistral"]
