[project]
name = "envcite-ontology"
version = "0.1.0"
description = "envcite ontology service (gRPC)"
readme = "README.md"
authors = [
    { name = "Eli Hu", email = "elihu@go.thu.edu.tw" }
]
requires-python = ">=3.14"
dependencies = [
    "clingo",
    "envcite-grpc",
    "envcite-jobkit",
    "envcite-proto",
    "envcite-segmenter",
    "grpcio-health-checking",
    "grpcio-reflection",
    "grpcio-status",
    "jinja2",
    "lxml",
    "psycopg-pool",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
]

[tool.uv.sources]
envcite-grpc = { workspace = true }
envcite-jobkit = { workspace = true }
envcite-proto = { workspace = true }
envcite-segmenter = { workspace = true }

[project.scripts]
envcite-ontology = "envcite_ontology.server:main"
envcite-migrate = "envcite_ontology.migrate:main"
envcite-acquire = "envcite_ontology.acquire.cli:main"
envcite-import = "envcite_ontology.ingest.cli:main"
envcite-sync = "envcite_ontology.sync:main"
envcite-annotate = "envcite_ontology.annotate:main"
envcite-guidance = "envcite_ontology.guidance_sync.cli:main"
envcite-ruling = "envcite_ontology.ruling_sync:main"
envcite-history = "envcite_ontology.history_sync.cli:main"
envcite-verify = "envcite_ontology.verification.cli:main"
envcite-pipeline = "envcite_ontology.verification.run:main"

[project.optional-dependencies]
llm = [
    "anthropic",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
