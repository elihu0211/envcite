[project]
name = "env-law"
version = "0.1.0"
description = "env-law ontology service (ELI RDF/OWL over gRPC)"
readme = "README.md"
authors = [
    { name = "Eli Hu", email = "elihu@go.thu.edu.tw" }
]
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.84.0",
    "grpcio-health-checking>=1.84.0",
    "protobuf>=7.35.1,<8",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.2",
    "env-law-grpc",
]

[tool.uv.sources]
env-law-grpc = { path = "../../libs/python/env-law-grpc" }

[project.scripts]
env-law-ontology = "env_law.server:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
    "mypy>=2.3.1",
    "mypy-protobuf>=5.1.0",
    "pyshacl>=0.40.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "testcontainers[postgres]>=4.9",
    "types-grpcio>=1.83.0.20260730",
    "types-grpcio-health-checking>=1.0.0.20260518",
    "types-protobuf>=7.35.1.20260906",
]

[tool.ruff]
line-length = 100
extend-exclude = ["src/env_law/ontology/v1/*_pb2*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# Generated by grpc_tools; typed via the committed .pyi stubs.
module = "env_law.ontology.v1.*"
ignore_errors = true

[tool.pytest]
minversion = "9.0"
addopts = ["-ra"]
testpaths = ["tests"]
strict = true
# rdflib internals (used by pySHACL) emit deprecation noise outside our control.
filterwarnings = ["ignore::DeprecationWarning:rdflib.*"]
