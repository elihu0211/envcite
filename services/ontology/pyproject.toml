[project]
name = "env-law-ontology"
version = "0.1.0"
description = "env-law ontology service (ELI over gRPC)"
readme = "README.md"
authors = [
    { name = "Eli Hu", email = "elihu@go.thu.edu.tw" }
]
requires-python = ">=3.14"
dependencies = [
    "env-law-grpc",
    "env-law-proto",
    "env-law-segmenter",
    "grpcio-health-checking",
    "psycopg-pool",
    "psycopg[binary]",
]

[tool.uv.sources]
env-law-grpc = { workspace = true }
env-law-proto = { workspace = true }
env-law-segmenter = { workspace = true }

[project.scripts]
env-law-ontology = "env_law_ontology.server:main"
env-law-migrate = "env_law_ontology.migrate:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
