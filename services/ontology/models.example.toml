# 模型配置範本（`env-law-pipeline --models models.toml`）。複製成 models.toml 再改；
# 金鑰不寫在這裡，只寫它放在哪裡：環境變數的名稱，或專案內一個不進版控的檔案的路徑。
#
# 家族（family）是獨立性規則所依：驗證者不得與抽取者同一家族，評審團至少要兩個不同家族。
# 由人宣告，不從名字推測。託管端點上的模型名稱可能是別名（同一個模型掛在幾個名字下），
# 宣告前先查清楚；管線開跑前還會對所有模型問兩個固定問題，答案逐字相同就拒絕開跑。

# 一個 OpenAI 相容的端點。base_url 與 base_url_env 二選一：後者從環境變數讀，檔案裡不出現網址。
# 金鑰二選一：api_key_env 是環境變數的名稱；api_key_file 是檔案的路徑（相對於這個設定檔），
# 檔案只放金鑰、放在被 .gitignore 忽略的地方（services/ontology/.secrets/），
# 在 git 工作樹裡又沒被忽略的金鑰檔會被拒絕載入。不想用環境變數時，改成：
#   base_url = "https://…/v1"
#   api_key_file = ".secrets/chat_key"
[endpoint.hosted]
base_url_env = "CHAT_BASE_URL"
api_key_env = "CHAT_API_KEY"

# name 是送給端點的模型識別，原樣送出。
# 選用：max_tokens（回答長度上限）、max_retries（暫時性失敗的重試次數，預設 3，0 為不重試）。
[model.extractor]
endpoint = "hosted"
name = "mistral-small-4"
family = "mistral"

[model.gemma]
endpoint = "hosted"
name = "gemma-4-31b"
family = "google"

[model.llama]
endpoint = "hosted"
name = "llama4scout"
family = "meta"

[model.inkling]
endpoint = "hosted"
name = "vibe"
family = "inkling"

# Anthropic 的模型不經端點，金鑰取自 ANTHROPIC_API_KEY（需要 `uv sync --extra llm`）。
# [model.claude]
# provider = "anthropic"
# name = "claude-sonnet-5-5"

# 角色：誰抽取、誰做往返驗證的重抽、誰設計獨立測試、誰組成評審團。
[roles]
extractor = "extractor"
roundtrip = "gemma"
independent_test = "inkling"
panel = ["gemma", "llama", "inkling"]
