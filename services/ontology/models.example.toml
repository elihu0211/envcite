# 模型配置範本：複製成 models.toml 再改（說明見 README「模型配置」）。
#
# family 由人宣告，獨立性規則依它判定：驗證者不得與抽取者同一家族，評審團至少要兩個不同家族。
# 同一個模型常掛在幾個端點名稱下（如 gpt-oss-120b 與 mistral-small-4 是同一個），宣告前先查清楚。

# 一個 OpenAI 相容的端點。網址與金鑰各有兩種寫法：
#   base_url = "https://…/v1"       或  base_url_env = "<環境變數>"
#   api_key_file = ".secrets/key"   或  api_key_env  = "<環境變數>"（相對於本檔，檔案放在被忽略的位置）
[endpoint.hosted]
base_url_env = "CHAT_BASE_URL"
api_key_env = "CHAT_API_KEY"

# name 原樣送給端點。選用：max_tokens（預設 8192）、max_retries（預設 3，0 為不重試）。
# 推理模型的思考計入輸出長度，max_tokens 要留足。
[model.extractor]
endpoint = "hosted"
name = "mistral-small-4"
family = "mistral"

[model.gemma]
endpoint = "hosted"
name = "gemma-4-31b"
family = "google"

[model.llama]
endpoint = "hosted"
name = "llama4scout"
family = "meta"

[model.coder]
endpoint = "hosted"
name = "coder"
family = "inkling"

# Anthropic 的模型不經端點，金鑰取自 ANTHROPIC_API_KEY（需要 `uv sync --extra llm`）。
# [model.claude]
# provider = "anthropic"
# name = "claude-sonnet-5-5"

# 四個角色都要指名：
#   抽取者：mistral-small-4（mistral）。
#   往返重抽者：gemma-4-31b（google）。
#   獨立測試設計者：coder（inkling）。
#   評審團：gemma-4-31b、llama4scout（meta）、coder（inkling）。
[roles]
extractor = "extractor"
roundtrip = "gemma"
independent_test = "coder"
panel = ["gemma", "llama", "coder"]
