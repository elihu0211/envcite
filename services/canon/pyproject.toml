[project]
name = "canon"
version = "0.1.0"
description = "canon: shared knowledge service (gRPC)"
readme = "README.md"
authors = [
    { name = "Eli Hu", email = "elihu@go.thu.edu.tw" }
]
requires-python = ">=3.14"
dependencies = [
    "clingo",
    "envcite-grpc",
    "envcite-jobkit",
    "envcite-proto",
    "envcite-segmenter",
    "grpcio-health-checking",
    "grpcio-reflection",
    "grpcio-status",
    "httpx",
    "jinja2",
    "lxml",
    "openai",
    "psycopg-pool",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
]

[project.urls]
Repository = "https://github.com/elihu0211/envcite"

[tool.uv.sources]
envcite-grpc = { workspace = true }
envcite-jobkit = { workspace = true }
envcite-proto = { workspace = true }
envcite-segmenter = { workspace = true }

[project.scripts]
canon = "canon.cli:main"

[project.optional-dependencies]
llm = [
    "anthropic",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
